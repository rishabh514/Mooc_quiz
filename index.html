*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  font-size:var(--fs-base);
  line-height:1.55;
  font-weight:400;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background-color var(--base) var(--ease),color var(--base) var(--ease);
}
#root{position:relative;z-index:1}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.25}
h1{font-size:var(--fs-xl);letter-spacing:-.02em}
h2{font-size:var(--fs-lg);letter-spacing:-.015em}
h3{font-size:var(--fs-base);letter-spacing:-.01em}
p{margin:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-soft);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.qtext,.qreview-question,.option .body,.opts li,.explain,.reveal-explain{
  overflow-wrap:break-word;word-wrap:break-word;word-break:break-word;
}
/* Code block and formatting styles for programming questions */
.code-block {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r);
  padding: var(--s3) var(--s4);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: var(--fs-xs);
  line-height: 1.5;
  color: var(--text);
  overflow-x: auto;
  margin: var(--s3) 0;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
  max-width: 100%;
}
.code-block code {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  padding: 0;
  border: 0;
}
.inline-code {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9em;
  color: var(--accent);
}
.case-study-box {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  padding: var(--s3) var(--s4);
  border-radius: 0 var(--r) var(--r) 0;
  font-size: var(--fs-xs);
  line-height: 1.6;
  color: var(--text-2);
  margin-bottom: var(--s3);
}
/* FAQ accordion (AEO-friendly semantic content) */
.faq{display:flex;flex-direction:column;gap:0}
.faq-item{border-bottom:1px solid var(--border);padding:var(--s4) 0}
.faq-item:last-child{border-bottom:0}
.faq-item summary{
  font-weight:600;font-size:var(--fs-sm);color:var(--text);cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:flex-start;
  gap:var(--s3);padding:2px 0;letter-spacing:-.005em;line-height:1.4;
}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{
  content:'+';font-size:18px;font-weight:400;color:var(--muted);
  flex:0 0 auto;line-height:1;
  transition:transform var(--base) var(--ease),color var(--fast) var(--ease);
}
.faq-item[open] summary::after{content:'−';color:var(--accent)}
.faq-item summary:hover{color:var(--accent)}
.faq-item p{margin-top:var(--s2);font-size:var(--fs-sm);line-height:1.65;color:var(--text-2);max-width:70ch}

 .install-card{align-items:stretch;flex-direction:column;gap:12px;padding:14px}

.course-disclaimer {

  border: 1px solid rgba(161,98,7,.24);
  border-left: 4px solid var(--amber);
  border-radius: var(--r-lg);
  background: var(--amber-bg);
  color: var(--text-2);
  font-size: var(--fs-sm);
  line-height: 1.65;
}
.course-disclaimer-heading {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 7px;
  color: var(--text);
  font-size: var(--fs-sm);
  font-weight: 750;
  line-height: 1.4;
}
.course-disclaimer-symbol {
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--amber-bg);
  border: 1px solid rgba(161,98,7,.28);

@media (max-width: 520px) {
  .course-disclaimer { padding: 13px 14px; }
}

/* Assignment-faithful question layout: readable case study + code, no page screenshots */
.assignment-scenario {
  margin: 0 0 14px; padding: 16px 18px;
  border: 1px solid var(--accent-line, var(--border-2));
  border-left: 4px solid var(--accent); border-radius: 12px;
  background: var(--accent-soft); color: var(--text);
}
.assignment-scenario-heading {

  font-size:var(--fs-sm); font-weight:750; letter-spacing:.02em; margin-bottom:9px;
}
.scenario-icon { font-size:16px; }
.assignment-scenario-title {
  margin:0 0 8px; color:var(--text); font-size:var(--fs-base);
  font-weight:750; line-height:1.4;
}
.assignment-scenario-text {
  color:var(--text-2); font-size:var(--fs-sm); line-height:1.75; overflow-wrap:anywhere;
}
.assignment-scenario-text p { margin:0 0 9px; }
.assignment-scenario-text p:last-child { margin-bottom:0; }
.source-question-meta {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;

}
.source-question-label { color:var(--text); font-weight:750; }
.source-page-link {
  display:inline-flex; align-items:center; gap:4px; margin-top:4px;
  color:var(--accent); font-size:var(--fs-xs); font-weight:650;

.source-page-link:hover { text-decoration:none; opacity:.8; }
.source-page-link-button {

}
.source-image-viewer-backdrop {
  position:fixed; inset:0; z-index:10050;

  padding:clamp(10px, 3vw, 28px);

  animation:overlayIn var(--base) var(--ease) both;
}
.source-image-viewer {
  display:flex; flex-direction:column; width:min(1100px, 100%);
  max-height:min(94dvh, 1100px); min-height:0;
  border:1px solid var(--border-2); border-radius:16px;
  overflow:hidden; background:var(--surface); color:var(--text);
  box-shadow:var(--shadow-lg); animation:modalIn var(--slow) var(--ease) both;
}
.source-image-viewer-head {
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:13px 16px; flex:0 0 auto;
  border-bottom:1px solid var(--border); background:var(--surface);
}
.source-image-viewer-heading { min-width:0; }
.source-image-viewer-title {
  font-size:var(--fs-sm); font-weight:750; line-height:1.35;
  overflow-wrap:anywhere;
}
.source-image-viewer-subtitle { margin-top:3px; color:var(--muted); font-size:var(--fs-xs); }
.source-image-viewer-close {
  width:40px; height:40px; flex:0 0 auto; display:grid; place-items:center;
  border:1px solid var(--border); border-radius:10px; color:var(--text);
  background:var(--surface-2); cursor:pointer;
}
.source-image-viewer-close:hover { border-color:var(--border-2); background:var(--surface-3); }
.source-image-viewer-body {
  min-height:0; overflow:auto; overscroll-behavior:contain;
  padding:clamp(8px, 2vw, 20px); text-align:center;
  background:var(--bg); -webkit-overflow-scrolling:touch;
}
.source-image-viewer-image {
  display:block; width:auto; height:auto; max-width:100%;
  max-height:calc(90dvh - 100px); object-fit:contain; margin:0 auto;
  border:1px solid var(--border); border-radius:6px; background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.source-image-viewer-error {
  max-width:560px; margin:20px auto; padding:16px;
  border:1px solid var(--border); border-radius:12px;

}
@media (max-width:639px) {

  .source-image-viewer-head { padding:calc(10px + var(--safe-t)) 12px 10px; }
  .source-image-viewer-body { padding:8px; }
  .source-image-viewer-image { max-height:calc(100dvh - 100px); }
}
.assignment-code-panel {

}
.assignment-code-header {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 14px; border-bottom:1px solid var(--border); background:var(--surface);
}
.assignment-code-title { display:flex; align-items:center; gap:9px; font-size:var(--fs-sm); font-weight:750; color:var(--text); }
.code-glyph { color:var(--accent); font-family:ui-monospace,monospace; font-weight:850; font-size:17px; }
.assignment-code-subtitle { margin-top:3px; color:var(--muted); font-size:var(--fs-xs); line-height:1.45; }
.language-pill { flex-shrink:0; border:1px solid var(--border-2); border-radius:7px; padding:5px 9px; font-size:var(--fs-xs); color:var(--text-2); background:var(--surface-2); }
.python-code-scroll { overflow-x:auto; max-width:100%; background:var(--code-bg, #101722); }
.python-code {
  margin:0; padding:12px 0; min-width:max-content; white-space:pre;
  color:var(--code-fg, #e5edf7); font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:4;
}
.python-code code { display:block; font:inherit; color:inherit; background:none; padding:0; border:0; }
.python-code-line { display:flex; min-height:1.65em; padding-right:16px; }
.python-code-line:hover { background:rgba(127,145,170,.07); }
.python-line-number { display:inline-block; width:42px; flex:0 0 42px; padding-right:12px; text-align:right; color:#64748b; user-select:none; border-right:1px solid rgba(127,145,170,.15); margin-right:0; }
.python-line-content { display:inline-block; padding-right:18px; }
.syn-keyword { color:#c792ea; font-weight:600; }
.syn-string { color:#a5d6a7; }
.syn-number { color:#f6c177; }
.syn-builtin { color:#82aaff; }
.syn-constant { color:#ffcb6b; }
.syn-comment { color:#8292a8; font-style:italic; }
.syn-operator { color:#89ddff; }
.syn-variable { color:var(--code-fg, #e5edf7); }
@media (max-width:600px) {
  .assignment-scenario { padding:13px 14px; }
  .assignment-scenario-text { font-size:14px; line-height:1.7; }
  .assignment-code-header { padding:10px 12px; }

/* ── Refined navigation, responsive week grid, and quiz header ───────────── */
.topbar{
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(140%) blur(16px);
  -webkit-backdrop-filter:saturate(140%) blur(16px);
  box-shadow:0 1px 0 rgba(0,0,0,.015);
}
.topbar-in{gap:clamp(8px,1.2vw,16px)}
.brand-mark{
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 3px 10px rgba(0,0,0,.14);
}
.top-tabs{
  align-items:center;gap:3px;padding:4px;margin-left:clamp(4px,1vw,14px);
  border:1px solid var(--border);border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow-xs);
}
.top-tabs button{
  min-height:34px;display:inline-flex;align-items:center;justify-content:center;
  padding:7px clamp(8px,.9vw,13px);border:1px solid transparent;border-radius:10px;
  color:var(--text-2);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease),border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
}
.top-tabs button:hover{color:var(--text);background:var(--surface-2)}
.top-tabs button.active{
  color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.top-actions{gap:6px;margin-left:2px}
.top-actions .icon-btn{
  width:36px;height:36px;border:1px solid var(--border);border-radius:11px;
  background:var(--surface);color:var(--text-2);
}
.top-actions .icon-btn:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.bottom-nav{
  padding:6px 8px var(--safe-b);gap:4px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(150%) blur(18px);-webkit-backdrop-filter:saturate(150%) blur(18px);
  box-shadow:0 -8px 28px rgba(0,0,0,.08);
  border-top:1px solid var(--border);
}
.bottom-nav button{
  border-radius:12px;gap:1px;padding-top:3px;
  font-size:10.5px;font-weight:600;letter-spacing:0;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.bottom-nav button::before{top:-6px;width:24px;height:3px;border-radius:0 0 4px 4px}
.bottom-nav button.active{background:var(--accent-soft);color:var(--accent)}
.bottom-nav svg{
  box-sizing:content-box;padding:4px 10px;border-radius:9px;
  transition:background var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.bottom-nav button.active svg{background:var(--accent-soft);transform:translateY(-1px)}
.bottom-nav button:active{transform:scale(.97)}
@media (min-width:768px) and (max-width:980px){
  .top-tabs{gap:1px;padding:3px;margin-left:4px}
  .top-tabs button{padding:6px 7px;font-size:11px;min-height:32px}
  .brand-mark{width:38px;height:38px}
  .top-actions{gap:3px}
}
@media (max-width:767px){
  .topbar-in:not(.quiz-topbar-in){gap:8px}
  .brand{gap:8px}
  .brand-mark{width:40px;height:40px;border-radius:10px}
  .brand-title{font-size:var(--fs-sm)}
  .brand-sub{max-width:34vw}
  .top-actions .icon-btn{width:34px;height:34px;border-radius:10px}
  .bottom-nav{left:8px;right:8px;bottom:calc(6px + var(--safe-b));height:calc(var(--nav-h) - 2px);padding:5px 4px 3px;border:1px solid var(--border);border-radius:17px}
  .bottom-nav button::before{top:-5px}
  .app-main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 30px)}
}

/* Week selection: compact two-column mobile cards and four-column desktop grid. */
.custom-set-card{overflow:hidden}
.custom-set-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.custom-set-intro .muted{margin:0;max-width:64ch}
.custom-selection-count{
  flex:0 0 auto;padding:5px 9px;border:1px solid var(--border);border-radius:99px;
  background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:700;white-space:nowrap;
}
.custom-week-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.custom-week-grid .chk{min-width:0;gap:9px;padding:12px;align-items:center}
.custom-week-grid .chk .box{width:19px;height:19px}
.custom-week-name{font-weight:650;font-size:var(--fs-sm);line-height:1.3;overflow-wrap:anywhere}
@media (min-width:768px){.custom-week-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
@media (max-width:420px){
  .custom-set-intro{flex-direction:column;gap:8px}
  .custom-week-grid{gap:8px}
  .custom-week-grid .chk{padding:10px 9px;gap:7px}
  .custom-week-name{font-size:12px}
  .custom-selection-count{align-self:flex-start}
}
.custom-randomization{
  padding:14px;border:1px solid var(--border);border-radius:14px;
  background:var(--surface-2);transition:border-color var(--base) var(--ease),background var(--base) var(--ease),box-shadow var(--base) var(--ease);
}
.custom-randomization.ready{
  border-color:var(--accent-line);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2) 72%);
  box-shadow:0 0 0 1px var(--accent-soft),0 5px 18px rgba(0,0,0,.04);
}
.custom-randomization-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.custom-subhead{font-size:var(--fs-sm);font-weight:750;letter-spacing:-.01em;color:var(--text)}
.custom-randomization-heading .tiny{margin-top:3px}
.custom-state-chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 8px;white-space:nowrap;
  border:1px solid var(--border);border-radius:99px;background:var(--surface);color:var(--muted);
  font-size:10px;font-weight:750;transition:all var(--base) var(--ease);
}
.custom-state-chip.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.custom-randomization .shuffle-controls{margin:0;border-radius:10px;background:var(--surface);}
.custom-randomization .shuffle-controls .setrow{padding:11px 2px}
.custom-randomization .shuffle-controls .setrow:last-child{padding-bottom:10px}
.custom-start-area{
  display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:16px;padding:15px;
  border:1px solid var(--border);border-radius:14px;background:var(--surface-2);
  transition:border-color var(--base) var(--ease),background var(--base) var(--ease),box-shadow var(--base) var(--ease);
}
.custom-start-area.ready{
  border-color:var(--accent-line);background:linear-gradient(115deg,var(--accent-soft),var(--surface-2) 72%);
  box-shadow:0 0 0 1px var(--accent-soft);
}
.custom-start-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.custom-start-copy strong{font-size:var(--fs-sm);font-weight:750;color:var(--text)}
.custom-start-copy span{font-size:var(--fs-xs);line-height:1.5;color:var(--text-2)}
.custom-start-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.custom-count-control{display:flex;align-items:center;gap:8px}
.custom-start-btn{flex:1 1 220px;min-width:0;gap:8px;min-height:46px;font-weight:750;transition:box-shadow var(--base) var(--ease),opacity var(--base) var(--ease),transform var(--fast) var(--ease)}
.custom-start-btn:disabled{opacity:.52;filter:saturate(.55);box-shadow:none;cursor:not-allowed}
.custom-start-area.ready .custom-start-btn:not(:disabled){box-shadow:0 0 0 3px var(--accent-soft),0 7px 20px var(--accent-glow);animation:customReadyGlow 2.2s ease-in-out infinite}
.custom-start-area.ready .custom-start-btn:not(:disabled):hover{animation:none;transform:translateY(-1px);box-shadow:0 0 0 4px var(--accent-soft),0 9px 25px var(--accent-glow)}
.custom-clear-btn{min-width:76px}
.custom-clear-btn:disabled{opacity:.4;cursor:not-allowed}
.custom-start-hint{display:block}
@keyframes customReadyGlow{0%,100%{box-shadow:0 0 0 2px var(--accent-soft),0 4px 14px var(--accent-glow)}50%{box-shadow:0 0 0 4px var(--accent-soft),0 8px 23px var(--accent-glow)}}
@media (prefers-reduced-motion:reduce){.custom-start-area.ready .custom-start-btn:not(:disabled){animation:none}}
@media (max-width:520px){
  .custom-randomization{padding:11px}
  .custom-randomization-heading{align-items:flex-start;flex-direction:column}
  .custom-state-chip{align-self:flex-start}
  .custom-start-area{padding:12px}
  .custom-start-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%}
  .custom-start-btn{grid-column:1 / -1;width:100%;flex:auto}
  .custom-clear-btn{grid-column:2;grid-row:2}
  .custom-count-control{grid-column:1;grid-row:2}
  .custom-count-control .stepper{height:38px}
  .custom-count-control .stepper button{width:36px}
  .custom-count-control .stepper input{width:42px}
}

/* A centered, task-first quiz header with a visible return path and stronger timer. */
.quiz-topbar{z-index:50}
.quiz-topbar .wrap{max-width:1240px}
.topbar-in.quiz-topbar-in{
  height:auto;min-height:76px;padding:11px 0 12px;
  display:grid;grid-template-columns:minmax(160px,1fr) minmax(220px,1.2fr) minmax(160px,1fr);
  gap:14px;align-items:center;
}
.quiz-back-btn{
  justify-self:start;display:inline-flex;align-items:center;justify-content:center;gap:8px;

<script>
/* Mooc Mastery PWA update client.
   The service worker uses network-first for same-origin requests. Online deployments
   are checked on startup, when the app returns to foreground, and periodically.
   A newly activated worker reloads the page once so the deployed HTML/JS is used. */
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var reloadingForWorker = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloadingForWorker) return;
    reloadingForWorker = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
      .then(function (registration) {
        function checkForDeployment() {
          if (navigator.onLine && registration.update) {
            registration.update().catch(function () {});
          }
        }
        checkForDeployment();
        window.setInterval(checkForDeployment, 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForDeployment();
        });
        window.addEventListener('online', checkForDeployment);
      })
      .catch(function (error) {
        console.warn('Mooc Mastery: service worker registration failed.', error);
      });
  });
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const REPORT_FORM_URL = "https://forms.gle/9ZDhaZYQ7B3UBY3w9";

// GA4 event helper. The app continues working even if analytics is blocked/unavailable.
function trackGAEvent(eventName, params = {}) {
  if (typeof window.gtag === 'function') {
    window.gtag('event', eventName, params);
  }
}

function Portal({ children }) {
  const el = useMemo(() => document.createElement('div'), []);
  useEffect(() => {
    el.className = 'portal-root';
    document.body.appendChild(el);
    return () => { document.body.removeChild(el); };
  }, [el]);
  return ReactDOM.createPortal(children, el);
}

/* ─── FormattedText ──────────────────────────────────────────────────────────
   Renders markdown-ish content:
     • ```lang ... ``` fenced code blocks  → <pre class="code-block">
     • `inline code`                       → <code class="inline-code">
     • Plain newlines                      → <br>
   Plain strings without any markers render identically to before.
   ─────────────────────────────────────────────────────────────────────────── */
function FormattedText({ text }) {
  if (text == null) return null;
  const str = String(text);
  if (!str) return null;

  const parts = str.split(/(```[\s\S]*?```)/g);
  return (
    <>
      {parts.map((part, index) => {
        if (part.startsWith('```') && part.endsWith('```') && part.length >= 6) {
          const code = part.replace(/^```[a-zA-Z0-9_+-]*\n?/, '').replace(/```$/, '');
          return (
            <pre key={index} className="code-block">
              <code>{code}</code>
            </pre>
          );
        }
        const inlineParts = part.split(/(`[^`\n]+`)/g);
        return (
          <React.Fragment key={index}>
            {inlineParts.map((sub, sIdx) => {
              if (sub.length >= 2 && sub.startsWith('`') && sub.endsWith('`')) {
                return (
                  <code key={sIdx} className="inline-code">
                    {sub.slice(1, -1)}
                  </code>
                );
              }
              if (sub.indexOf('\n') === -1) return sub;
              const lines = sub.split('\n');
              return (
                <React.Fragment key={sIdx}>
                  {lines.map((line, lIdx) => (
                    <React.Fragment key={lIdx}>
                      {lIdx > 0 && <br />}
                      {line}
                    </React.Fragment>
                  ))}
                </React.Fragment>
              );
            })}

function highlightPythonLine(line) {
  const tokenRe = /(#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield)\b|\b(?:print|input|len|range|int|float|str|list|dict|set|tuple|sum|min|max|sorted|enumerate|zip|type|abs|round|open)\b|\b\d+(?:\.\d+)?\b|(?:\+=|-=|\*=|\/=|==|!=|<=|>=|->|\/\/|\*\*|[=+\-*\/%<>])|[A-Za-z_]\w*)/g;
  const out = [];
  let last = 0, match, key = 0;
  while ((match = tokenRe.exec(line)) !== null) {
    if (match.index > last) out.push(<React.Fragment key={key++}>{line.slice(last, match.index)}</React.Fragment>);
    const token = match[0];
    let cls = 'syn-variable';
    if (token.startsWith('#')) cls = 'syn-comment';
    else if (/^["']/.test(token)) cls = 'syn-string';
    else if (/^(False|None|True)$/.test(token)) cls = 'syn-constant';
    else if (/^(and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield)$/.test(token)) cls = 'syn-keyword';
    else if (/^(print|input|len|range|int|float|str|list|dict|set|tuple|sum|min|max|sorted|enumerate|zip|type|abs|round|open)$/.test(token)) cls = 'syn-builtin';
    else if (/^\d/.test(token)) cls = 'syn-number';
    else if (/^(?:\+=|-=|\*=|\/=|==|!=|<=|>=|->|\/\/|\*\*|[=+\-*\/%<>])$/.test(token)) cls = 'syn-operator';
    out.push(<span key={key++} className={cls}>{token}</span>);
    last = tokenRe.lastIndex;
  }
  if (last < line.length) out.push(<React.Fragment key={key++}>{line.slice(last)}</React.Fragment>);
  return out;
}

function answerIndices(q) {
  if (!q) return [];
  let a = q.answer;
  if (a === undefined || a === null) a = q.correct;
  if (a === undefined || a === null) a = q.correctAnswer;
  if (a === undefined || a === null) return [];
  const toIdx = (x) => {
    if (typeof x === 'number' && Number.isFinite(x)) return x | 0;
    if (typeof x === 'string') {
      const s = x.trim();
      if (/^\d+$/.test(s)) return parseInt(s, 10);
      if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
    }
    return -1;
  };
  let arr;
  if (Array.isArray(a)) arr = a;
  else if (typeof a === 'string' && a.includes(',')) arr = a.split(',');
  else arr = [a];
  return arr.map(toIdx).filter((n) => n >= 0);
}
function sameSet(a, b) {
  if (a.length !== b.length) return false;
  const s = new Set(b);
  return a.every((x) => s.has(x));
}
function prepareQuestion(q, shuffleOpts) {
  const baseOptions = q._baseOptions || q.options || [];
  const baseAnswer = q._baseAnswer !== undefined ? q._baseAnswer : q.answer;
  const baseQ = { ...q, options: baseOptions, answer: baseAnswer, _baseOptions: baseOptions, _baseAnswer: baseAnswer };
  if (!shuffleOpts || baseOptions.length < 2) return baseQ;
  const order = shuffle(baseOptions.map((_, i) => i));
  const map = {};
  order.forEach((oldI, newI) => { map[oldI] = newI; });
  return { ...baseQ, options: order.map((i) => baseOptions[i]), answer: answerIndices(baseQ).map((oi) => map[oi]) };
}

function normaliseSubject(raw, meta) {
  const id = meta.id;
  const title = meta.name || raw.course || 'Untitled subject';
  const institute = raw.institute || meta.institute || '';
  const term = raw.assignment || meta.term || '';
  const rawQs = raw.questions || raw.qs || [];
  const sourceDocs = raw.sourceDocuments || {};
  const byAssignment = {};
  const pageRecord = (week, pageNo) => {
    const pages = sourceDocs[String(week)]?.pages || [];
    return pages.find((p) => Number(p.page) === Number(pageNo)) || null;
  };
  const pageAssetUrl = (page) => {
    const image = page && page.image ? String(page.image).replace(/^\/+/, '') : '';
    return image ? '/assets/' + image : '';
  };
  rawQs.forEach((q, i) => {
    const week = q.week != null ? q.week : 1;
    // Only explicitly versioned assignments receive a separate grouping key.
    // Legacy subject JSON files continue to group exactly as before by week.
    const aid = q.assignmentId || ('W' + week);
    const aname = q.assignmentName || ('Week ' + week);
    if (!byAssignment[aid]) byAssignment[aid] = { id: aid, name: aname, week: week, questions: [] };
    const pdfSource = q.pdfSource || {};
    const sourceOptions = Array.isArray(pdfSource.options) ? pdfSource.options : (q.options || []);
    const options = sourceOptions.map((o) =>
      typeof o === 'string' ? o : (o && (o.text ?? o.value ?? o.label)) ?? String(o)
    );
    const answer =
      q.correctAnswer !== undefined ? q.correctAnswer :
      q.answer !== undefined ? q.answer :
      q.correct !== undefined ? q.correct : null;
    const sourcePage = pdfSource.questionPage ?? q.sourcePage ?? (q.sourcePages || [])[0] ?? null;
    const programContext = pdfSource.programContext || q.programContext || null;
    const codePages = (programContext && Array.isArray(programContext.codePages)) ? programContext.codePages : [];
    const programSourcePage = codePages.length ? codePages[0].page : null;
    byAssignment[aid].questions.push({
      id: q.id || (q.questionNo ? `${aid}-Q${q.questionNo}` : `${aid}-${i}`),
      question: pdfSource.questionText ?? q.question ?? q.text ?? '',
      options, answer,
      explanation: pdfSource.justificationText ?? q.explanation ?? q.solution ?? '',
      scenarioTitle: pdfSource.scenarioTitle ?? q.scenarioTitle ?? '',
      scenarioText: pdfSource.scenarioText ?? q.scenarioText ?? '',
      sourceQuestionLabel: pdfSource.questionLabel || q.sourceQuestionLabel || '',
      sourceAnswerText: pdfSource.printedAnswerText || q.sourceAnswerText || '',
      sourceAnswerLabel: pdfSource.printedAnswerLabel || q.sourceAnswerLabel || 'Answer:',
      sourcePage,
      sourcePageImage: pageAssetUrl(pageRecord(week, sourcePage)),
      sourcePageImages: q.sourcePageImages || [],
      sourcePages: pdfSource.sourcePages || q.sourcePages || [],
      programContext,
      programText: pdfSource.programText ?? q.programText ?? '',
      programLanguage: pdfSource.programLanguage || q.programLanguage || 'python',
      programSourcePage,
      programSourcePageImage: pageAssetUrl(pageRecord(week, programSourcePage)),
      pdfSource: pdfSource,
      _aid: aid, _aname: aname,
      _week: week, _qno: q.questionNo, _type: q.type || 'MCQ',
    });
  });
  const assignments = Object.values(byAssignment).sort((a, b) => {
    if (a.week !== b.week) return a.week - b.week;
    return a.id.localeCompare(b.id);
  });
  return { id, title, institute, term, contentNotice: raw.contentNotice || null, assignments };
}

function allQuestions(subject) {
  if (!subject || !subject.assignments) return [];
  const out = [];
  subject.assignments.forEach((a) => a.questions.forEach((q) => out.push(q)));
  return out;
}
function weakQuestions(subject, progress) {
  const out = [];
  subject.assignments.forEach((a) => a.questions.forEach((q) => {
    const st = progress.questions[q.id];
    if (!st || !st.a) return;
    const acc = st.c / st.a;
    if (st.w >= 2 && acc < 0.6) out.push({ q, st, weight: st.w - st.c });
  }));
  return out.sort((x, y) => y.weight - x.weight || y.st.w - x.st.w);
}
function paceProfile(items) {
  const answered = items.filter((i) => !i.skipped);
  const avg = answered.length ? answered.reduce((s, i) => s + i.timeMs, 0) / answered.length : 0;
  const thresh = avg || 1;
  const counts = { perfect: 0, deliberate: 0, hasty: 0, stuck: 0 };
  answered.forEach((i) => {
    const fast = i.timeMs <= thresh;
    const k = i.correct ? (fast ? 'perfect' : 'deliberate') : (fast ? 'hasty' : 'stuck');
    counts[k]++;
  });
  return { counts, avg, thresh };
}

function Stepper({ value, onChange, min = 1, max = 999, step = 5 }) {
  const clamp = (v) => Math.min(max, Math.max(min, v));
  return (
    <div className="stepper">
      <button type="button" onClick={() => onChange(clamp(value - step))} aria-label="Decrease">−</button>

      <button type="button" onClick={() => onChange(clamp(value + step))} aria-label="Increase">+</button>
    </div>
  );
}

function InstallAppPanel() {
  const [available, setAvailable] = useState(() => !!window.__moocInstallPrompt);
  const [installed, setInstalled] = useState(() => {
    try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
    catch (_) { return false; }
  });
  const [helpOpen, setHelpOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState('');

  useEffect(() => {
    const onAvailable = () => { setAvailable(true); setMessage(''); };
    const onInstalled = () => { setInstalled(true); setAvailable(false); setHelpOpen(false); setMessage('Mooc Mastery is installed on this device.'); };
    window.addEventListener('pwa-install-available', onAvailable);
    window.addEventListener('pwa-installed', onInstalled);
    return () => {
      window.removeEventListener('pwa-install-available', onAvailable);
      window.removeEventListener('pwa-installed', onInstalled);
    };
  }, []);

  const handleInstall = async () => {
    if (installed) return;
    if (available && typeof window.installMoocMastery === 'function') {
      setBusy(true); setMessage('');
      try {
        const accepted = await window.installMoocMastery();
        if (accepted) {
          setMessage('Installation started. Follow your browser’s prompts to finish.');
          setAvailable(false);
        } else {
          setMessage('Installation was cancelled. You can try again whenever you’re ready.');
        }
      } catch (_) {
        setMessage('Your browser could not start installation. Use the browser menu instructions below.');
        setHelpOpen(true);
      } finally { setBusy(false); }
      return;
    }
    setHelpOpen(v => !v);
  };

  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isDesktop = !isIOS && !isAndroid;
  const helpText = isIOS
    ? <>In <strong>Safari</strong>, tap <strong>Share</strong>, then choose <strong>Add to Home Screen</strong> and tap <strong>Add</strong>.</>
    : isAndroid
      ? <>In <strong>Chrome</strong>, tap <strong>⋮</strong> and choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</>
      : <>In <strong>Chrome or Edge</strong>, open the browser menu and choose <strong>Install Mooc Mastery</strong> or <strong>Apps → Install this site as an app</strong>. If that option is missing, check that the site is online and its manifest and service worker are available.</>;

  return (
    <div className="install-wrap">
      <div className="install-card">
        <div className="install-card-copy">
          <span className="install-card-icon"><Icon name={installed ? 'check' : 'download'} size={21} /></span>
          <div>
            <div className="install-card-title">{installed ? 'Mooc Mastery is installed' : 'Take Mooc Mastery with you'}</div>
            <div className="install-card-desc">{installed ? 'Open it from your apps or home screen.' : 'Install the free app for a quicker, app-like experience on this device.'}</div>
          </div>
        </div>
        <button type="button" className="btn primary lg" onClick={handleInstall} disabled={installed || busy}>
          <Icon name={installed ? 'check' : 'download'} size={16} />
          {installed ? 'Installed' : busy ? 'Opening…' : 'Install app'}
        </button>
      </div>
      {message && <div className="install-help" role="status">{message}</div>}
      {helpOpen && !installed && (
        <div className="install-help" role="note">
          <button type="button" className="install-help-close" onClick={() => setHelpOpen(false)} aria-label="Close installation instructions">✕</button>
          <strong>Install from your browser</strong><br />
          {helpText}
          <div className="tiny" style={{marginTop:6}}>If you don’t see an install option, your browser may not support PWA installation on this page yet. You can still use Mooc Mastery in your browser.</div>
        </div>
      )}
    </div>
  );
}

function QuizRunner({ config, settings, bookmarks, onToggleBookmark, onFinish, onQuit }) {
  const [questions, setQuestions] = useState(() => config.questions);
  const isJoyOfComputing = config.subjectId === 'joy_of_computing_using_python';
  const [shuffleQuestions, setShuffleQuestions] = useState(() => isJoyOfComputing ? false : (config.shuffleQuestions ?? settings.shuffleQuestions));
  const [shuffleOptions, setShuffleOptions] = useState(() => config.shuffleOptions ?? settings.shuffleOptions);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState([]);
  const [locked, setLocked] = useState(false);
  const [records, setRecords] = useState([]);
  const [elapsed, setElapsed] = useState(0);
  const [flash, setFlash] = useState(null);
  const [sourceImage, setSourceImage] = useState(null);
  const [sourceImageError, setSourceImageError] = useState(false);
  const qStart = useRef(Date.now());
  const t0 = useRef(Date.now());
  const flashTimer = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setElapsed(Date.now() - t0.current), 250);
    return () => clearInterval(t);
  }, []);
  useEffect(() => () => clearTimeout(flashTimer.current), []);
  useEffect(() => {
    if (!sourceImage) return undefined;
    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const handleViewerKey = (event) => {
      if (event.key === 'Escape') setSourceImage(null);
    };
    window.addEventListener('keydown', handleViewerKey);
    return () => {
      document.body.style.overflow = previousOverflow;
      window.removeEventListener('keydown', handleViewerKey);
    };
  }, [sourceImage]);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [idx]);

  const changeQuestionShuffle = useCallback((enabled) => {
    if (isJoyOfComputing) return;
    setShuffleQuestions(enabled);
    // Keep the current question and completed history stable; reorder only questions still ahead.
    setQuestions((prev) => {
      const fixed = prev.slice(0, idx + 1);
      const upcoming = prev.slice(idx + 1);
      const ordered = enabled
        ? shuffle(upcoming)
        : upcoming.slice().sort((a, b) => (Number(a._week) - Number(b._week)) || (Number(a._qno || 0) - Number(b._qno || 0)));
      return fixed.concat(ordered);
    });
  }, [idx, isJoyOfComputing]);

  const changeOptionShuffle = useCallback((enabled) => {
    setShuffleOptions(enabled);
    setQuestions((prev) => prev.map((question, questionIndex) => {
      // Don't change answer positions after the current question has been answered or selected.
      if (questionIndex < idx || (questionIndex === idx && (locked || selected.length > 0))) return question;
      return prepareQuestion(question, enabled);
    }));
  }, [idx, locked, selected.length]);

  const q = questions[idx];
  const correctIdx = useMemo(() => (q ? answerIndices(q) : []), [q]);
  const multi = String(q?._type || '').toUpperCase() === 'MSQ' || correctIdx.length > 1;
  const isLast = idx === questions.length - 1;
  const reveal = settings.instantFeedback && locked;
  const isCorrect = reveal && sameSet(selected, correctIdx);
  const correctCount = records.filter((r) => r.correct).length;

  const finish = useCallback((recs) => {
    const list = recs || records;
    const answered = list.filter((r) => !r.skipped);
    const score = answered.filter((r) => r.correct).length;
    const skippedCount = list.length - answered.length;

    // One event per quiz that reaches the app's completion flow.
    trackGAEvent('quiz_complete', {
      subject_id: config.subjectId || 'unknown',
      practice_mode: config.mode || 'unknown',
      questions_in_quiz: list.length,
      questions_answered: answered.length,
      questions_correct: score,
      questions_incorrect: answered.length - score,
      questions_skipped: skippedCount,
      score_percent: answered.length ? Math.round((score / answered.length) * 100) : 0,
      quiz_duration_seconds: Math.round((Date.now() - t0.current) / 1000),
    });

    onFinish({
      id: uid(), ts: Date.now(),
      mode: config.mode, modeLabel: config.title,
      assignmentIds: config.assignmentIds || [],
      score, total: answered.length,
      skipped: skippedCount,
      timeTotal: list.reduce((s, r) => s + r.timeMs, 0),
      items: list,
    });
  }, [records, onFinish, config]);

  const submit = useCallback((sel) => {
    if (locked || !q) return;
    const timeMs = Date.now() - qStart.current;
    const correct = sameSet(sel, correctIdx);

    // One question_answered event per submitted answer; skipped questions are tracked separately.
    const questionEventParams = {
      subject_id: config.subjectId || 'unknown',
      practice_mode: config.mode || 'unknown',
      question_number: idx + 1,
      week_id: String(q._aid || ''),
      is_correct: correct,
    };
    trackGAEvent('question_answered', questionEventParams);
    trackGAEvent(correct ? 'question_correct' : 'question_incorrect', questionEventParams);

    setSelected(sel);
    setLocked(true);
    setRecords((r) => [...r, {
      qid: q.id, correct, timeMs, skipped: false,
      sel: sel.map((i) => q.options[i]),
      ans: correctIdx.map((i) => q.options[i]),
      aid: q._aid, aname: q._aname,
    }]);
    if (settings.instantFeedback) {
      setFlash(correct ? 'correct' : 'wrong');
      vibrate(correct ? 25 : [15, 40, 15]);
      clearTimeout(flashTimer.current);
      flashTimer.current = setTimeout(() => setFlash(null), 480);
    } else vibrate(correct ? 20 : 35);
  }, [locked, q, correctIdx, settings.instantFeedback]);

  const advance = useCallback(() => {
    if (isLast) { finish(); return; }
    setIdx((i) => i + 1); setSelected([]); setLocked(false); qStart.current = Date.now();
  }, [isLast, finish]);

  const skip = useCallback(() => {
    if (!q) return;
    trackGAEvent('question_skipped', {
      subject_id: config.subjectId || 'unknown',
      practice_mode: config.mode || 'unknown',
      question_number: idx + 1,
      week_id: String(q._aid || ''),
    });
    const rec = {
      qid: q.id, correct: false, timeMs: Date.now() - qStart.current, skipped: true,
      sel: [], ans: correctIdx.map((i) => q.options[i]), aid: q._aid, aname: q._aname,
    };
    const recs = [...records, rec];
    setRecords(recs);
    if (isLast) finish(recs);
    else { setIdx((i) => i + 1); setSelected([]); setLocked(false); qStart.current = Date.now(); }
  }, [q, records, isLast, finish, correctIdx]);

  const choose = useCallback((i) => {
    if (locked) return;
    if (multi) { setSelected((s) => (s.includes(i) ? s.filter((x) => x !== i) : [...s, i])); return; }
    if (settings.instantFeedback) submit([i]);
    else setSelected([i]);
  }, [locked, multi, settings.instantFeedback, submit]);

  const needsSubmit = multi || !settings.instantFeedback;
  let primaryLabel, primaryAction, primaryDisabled;
  if (locked) { primaryLabel = isLast ? 'Finish' : 'Next'; primaryAction = advance; primaryDisabled = false; }
  else if (needsSubmit) { primaryLabel = 'Check answer'; primaryAction = () => submit(selected); primaryDisabled = selected.length === 0; }
  else { primaryLabel = 'Select an option'; primaryAction = () => {}; primaryDisabled = true; }

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT') return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && q && n <= q.options.length) { choose(n - 1); return; }
      if (e.key === 'Enter') { e.preventDefault(); if (!primaryDisabled) primaryAction(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [choose, primaryAction, primaryDisabled, q]);

  if (!q) return null;
  const isBookmarked = bookmarks.includes(q.id);
  const progressPct = ((idx + (locked ? 1 : 0)) / questions.length) * 100;

  return (
    <div className="app">
      {flash && <div className={'flash ' + flash} />}
      <div className="topbar quiz-topbar">
        <div className="wrap">
          <div className="topbar-in quiz-topbar-in">
            <button type="button" className="quiz-back-btn" onClick={onQuit} aria-label="Back">
              <Icon name="arrowL" size={16} /> <span>Back</span>
            </button>
            <div className="quiz-header-center" aria-live="polite">
              <div className="quiz-header-title">{config.title}</div>
              <div className="quiz-header-subtitle">
                <span>Question {idx + 1} of {questions.length}</span>
                <span className="quiz-header-dot" aria-hidden="true">·</span>
                <span>{Math.round(progressPct)}% complete</span>
              </div>
            </div>
            <div className="quiz-header-actions">
              <span className="quiz-timer" aria-label={'Elapsed time ' + fmtClock(elapsed)}>
                <Icon name="clock" size={14} /> <span>{fmtClock(elapsed)}</span>
              </span>
              <button type="button" className={'icon-btn quiz-bookmark-btn' + (isBookmarked ? ' active' : '')}
                onClick={() => onToggleBookmark(q.id)} aria-label={isBookmarked ? 'Remove bookmark' : 'Bookmark question'}
                aria-pressed={isBookmarked} title={isBookmarked ? 'Bookmarked' : 'Bookmark question'}>
                <Icon name={isBookmarked ? 'bookmarkF' : 'bookmark'} size={16} />
              </button>
            </div>
          </div>
          <div className="pbar quiz-progress-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(progressPct)}><i style={{ width: progressPct + '%' }} /></div>
        </div>
      </div>

      <div className="wrap" style={{ flex: 1 }}>
        <div className="page" style={{ paddingBottom: 'calc(96px + var(--safe-b))' }}>
          <div className="row between" style={{ marginBottom: 10 }}>
            <span className="badge blue">{q._aname}</span>
            <span className={'badge ' + (multi ? 'amber' : 'grey')}>{multi ? 'MSQ · Multiple Select' : 'MCQ · Multiple Choice'}</span>
            {multi && <span className="badge amber">Select {correctIdx.length}</span>}
            <span className="tiny" style={{ marginLeft: 'auto' }}>{correctCount} correct so far</span>
          </div>
          <div className="card">
            {q.scenarioText ? (
              <section className="assignment-scenario" aria-label="Assignment case study">
                <div className="assignment-scenario-heading">
                  <span className="scenario-icon" aria-hidden="true">✦</span>
                  <span>Case study / scenario</span>
                </div>
                {q.scenarioTitle ? <h3 className="assignment-scenario-title">{q.scenarioTitle}</h3> : null}
                <div className="assignment-scenario-text">
                  <FormattedText text={(() => {
                    const text = String(q.scenarioText || '').trim();
                    const title = String(q.scenarioTitle || '').trim();
                    return title && text.toLowerCase().startsWith(title.toLowerCase())
                      ? text.slice(title.length).replace(/^\\s*[.:—-]?\\s*/, '')
                      : text;
                  })()} />
                </div>
              </section>
            ) : null}
            {q.programText ? (
              <section className="assignment-code-panel" aria-label={String(q.programLanguage || 'python').toLowerCase() === 'scratch' ? 'Scratch block sequence' : 'Assignment program'}>
                <div className="assignment-code-header">
                  <div>
                    <div className="assignment-code-title"><span className="code-glyph" aria-hidden="true">{'</>'}</span> {String(q.programLanguage || 'python').toLowerCase() === 'scratch' ? 'Scratch block sequence' : (String(q.programLanguage || 'python').toLowerCase() === 'python' ? 'Python program' : String(q.programLanguage).toUpperCase() + ' program')}</div>
                    <div className="assignment-code-subtitle">Program transcription with the source line numbering and blank lines retained</div>
                    {q.programSourcePageImage ? (
                      <button
                        type="button"
                        className="source-page-link source-page-link-button"

                        aria-haspopup="dialog"
                      >

                      </button>
                    ) : null}
                  </div>
                  <span className="language-pill">{String(q.programLanguage || 'python').toUpperCase()}</span>
                </div>
                <PythonCodePanel code={q.programText} language={q.programLanguage} />
              </section>
            ) : null}
            {q.sourceQuestionLabel ? (
              <div className="source-question-meta">
                <span className="source-question-label">{q.sourceQuestionLabel}</span>
                {q.sourcePageImage ? (
                  <button
                    type="button"
                    className="source-page-link source-page-link-button"
                    onClick={() => { setSourceImageError(false); setSourceImage({ url: q.sourcePageImage, title: 'Original PDF question page', page: q.sourcePage }); }}
                    aria-haspopup="dialog"
                  >

                  </button>
                ) : null}
              </div>
            ) : null}

            <div style={{ marginTop: 14 }}>
              {q.options.map((opt, i) => {
                const isSel = selected.includes(i);
                const isCorr = correctIdx.includes(i);
                let cls = 'option';
                if (isSel) cls += ' selected';
                if (reveal && isCorr) cls += ' correct';
                if (reveal && isSel && !isCorr) cls += ' wrong';
                if (locked) cls += ' locked';
                return (
                  <button key={i} className={cls} onClick={() => choose(i)} disabled={locked}>
                    <span className="key">{String.fromCharCode(65 + i)}</span>
                    <span className="body">{opt}</span>
                    {reveal && isCorr && <span className="mark" style={{ color: 'var(--green)' }}><Icon name="check" size={16} /></span>}
                    {reveal && isSel && !isCorr && <span className="mark" style={{ color: 'var(--red)' }}><Icon name="x" size={16} /></span>}
                  </button>
                );
              })}
            </div>
            {reveal && (
              <div className={'reveal-card ' + (isCorrect ? 'ok' : 'bad')}>
                <div className="reveal-head">
                  {isCorrect ? <><Icon name="check" size={15} /> Correct</> : <><Icon name="x" size={15} /> Incorrect</>}
                </div>
                <div className="reveal-answer">
                  {!shuffleOptions && q.sourceAnswerText
                    ? <><b>{q.sourceAnswerLabel || 'Answer:'}</b> {q.sourceAnswerText}</>
                    : <>Correct answer: <b>{correctIdx.map(i => String.fromCharCode(65 + i)).join(', ')}</b></>}
                </div>
                {q.explanation && <div className="reveal-explain"><b>Justification:</b> <FormattedText text={q.explanation} /></div>}
              </div>
            )}
          </div>
          <div className="quiz-actions">
            <div className="quiz-actions-meta">
              <span className="tiny">Question {idx + 1}</span>
              <span className="tiny">{questions.length - idx - 1} remaining</span>
            </div>
            <div className="quiz-actions-row">
              <button className="btn" onClick={skip} disabled={locked}><Icon name="skip" size={13} /> Skip</button>
              <button className={'btn ' + (locked || needsSubmit ? 'primary' : 'soft')} onClick={primaryAction} disabled={primaryDisabled}>
                {primaryLabel}
                {locked && !isLast && <Icon name="arrowR" size={15} />}
              </button>
            </div>
          </div>
        </div>
      </div>
      {sourceImage ? (
        <div
          className="source-image-viewer-backdrop"
          role="presentation"
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) setSourceImage(null);
          }}
        >
          <section
            className="source-image-viewer"
            role="dialog"
            aria-modal="true"
            aria-label={sourceImage.title || 'Original assignment source'}
          >
            <div className="source-image-viewer-head">
              <div className="source-image-viewer-heading">
                <div className="source-image-viewer-title">{sourceImage.title || 'Original assignment source'}</div>
                <div className="source-image-viewer-subtitle">
                  {sourceImage.page ? `Page ${sourceImage.page} · ` : ''}View the original source without leaving Mooc Mastery
                </div>
              </div>
              <button
                type="button"
                className="source-image-viewer-close"
                onClick={() => setSourceImage(null)}
                aria-label="Close original source viewer"
                title="Close (Esc)"
              >
                <Icon name="x" size={19} />
              </button>
            </div>
            <div className="source-image-viewer-body">
              {sourceImageError ? (
                <div className="source-image-viewer-error" role="alert">
                  <strong>Could not load this source page.</strong>
                  <p style={{ marginTop: 6 }}>Check that the image exists in the deployed assets folder, then refresh the page.</p>
                  <p style={{ marginTop: 6, overflowWrap: 'anywhere' }}>{sourceImage.url}</p>
                </div>
              ) : (
                <img
                  className="source-image-viewer-image"
                  src={sourceImage.url}
                  alt={`${sourceImage.title || 'Original assignment source'}${sourceImage.page ? `, page ${sourceImage.page}` : ''}`}
                  onError={() => setSourceImageError(true)}
                />
              )}
            </div>
          </section>
        </div>
      ) : null}
    </div>
  );
}

function ResultView({ result, qmap, onHome, onRetryWrong, onStudyAssignment }) {
  const accuracy = pct(result.score, result.total);
  const wrongItems = result.items.filter((i) => !i.correct && !i.skipped);
  const [openItem, setOpenItem] = useState(null);
  const verdict = accuracy === 100 ? { t: 'Perfect score', c: 'green' }
    : accuracy >= 80 ? { t: 'Strong result', c: 'green' }
    : accuracy >= 50 ? { t: 'Getting there', c: 'amber' }
    : { t: 'Needs revision', c: 'red' };

  return (
    <div className="page wrap">
      <div className="row" style={{ gap: 12, alignItems: 'baseline' }}>
        <h1 style={{ fontFamily: 'var(--font-serif)', fontWeight: 600 }}>
          {result.score}<span style={{ color: 'var(--muted)', fontSize: 'var(--fs-lg)', fontWeight: 500, fontFamily: 'var(--font-sans)' }}>/{result.total}</span>
        </h1>
        <span className={'badge ' + verdict.c}>{verdict.t}</span>
      </div>
      <p className="muted" style={{ marginTop: 6 }}>{result.modeLabel}</p>

      <div className="grid g4" style={{ marginTop: 20 }}>
        <div className="stat"><div className="v">{accuracy}%</div><div className="l">Accuracy</div></div>
        <div className="stat"><div className="v">{fmtClock(result.timeTotal)}</div><div className="l">Total time</div></div>
        <div className="stat"><div className="v">{fmtClock(result.total ? result.timeTotal / result.total : 0)}</div><div className="l">Avg pace</div></div>
        <div className="stat"><div className="v">{result.skipped}</div><div className="l">Skipped</div></div>
      </div>

      <div className="row" style={{ marginTop: 20, gap: 8 }}>
        <button className="btn" onClick={onHome}><Icon name="arrowL" size={13} />Back</button>
        {wrongItems.length > 0 && (
          <button className="btn primary" onClick={() => onRetryWrong(wrongItems.map((i) => i.qid))}>
            <Icon name="refresh" size={13} />Retry {wrongItems.length} wrong
          </button>
        )}
      </div>

      <h2 className="section-title">Pace</h2>
      <div className="card"><PaceProfile items={result.items} /></div>
      <div className="card" style={{ marginTop: 12 }}><PaceJourney items={result.items} /></div>

      <h2 className="section-title">Answer review</h2>
      <div className="qreview-list">
        {result.items.map((it, i) => {
          const q = qmap[it.qid];
          const open = openItem === i;
          return (
            <div className="qreview" key={i}>
              <div className="qreview-head">
                <span className="qnum">#{i + 1}</span>
                <button className="badge grey" onClick={() => onStudyAssignment(it.aid)}>{it.aname}</button>
                <span style={{ marginLeft: 'auto' }} className={'badge ' + (it.skipped ? 'grey' : it.correct ? 'green' : 'red')}>
                  {it.skipped ? 'Skipped' : it.correct ? 'Correct' : 'Wrong'}
                </span>
                <span className="tiny" style={{ fontVariantNumeric: 'tabular-nums' }}>{(it.timeMs / 1000).toFixed(1)}s</span>
              </div>
              <div className="qreview-question"><FormattedText text={q ? q.question : '(missing)'} /></div>
              <div className="qreview-answers">
                <div>Your answer: <span className={it.correct ? 'ok' : 'bad'}>{it.sel.length ? it.sel.join(' · ') : 'skipped'}</span></div>
                {!it.correct && <div>Correct answer: <span className="ok">{it.ans.join(' · ')}</span></div>}
              </div>
              {q && q.explanation && (
                <>
                  <button className="btn sm" style={{ marginTop: 10 }} onClick={() => setOpenItem(open ? null : i)}>
                    {open ? 'Hide explanation' : 'Show explanation'}
                  </button>
                  {open && <div className="explain"><FormattedText text={q.explanation} /></div>}
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function HistoryView({ progress, qmap, totalQuestions, onStudyAssignment, onClear }) {
  const [open, setOpen] = useState(null);
  const runs = progress.history;
  const qStats = progress.questions || {};
  const seen = Object.keys(qStats).length;
  const attempts = Object.values(qStats).reduce((sum, stat) => sum + (stat.a || 0), 0);
  const correct = Object.values(qStats).reduce((sum, stat) => sum + (stat.c || 0), 0);
  const totalTests = runs.length;
  const avgAcc = totalTests ? Math.round(runs.reduce((sum, run) => sum + pct(run.score, run.total), 0) / totalTests) : 0;
  const bestAcc = totalTests ? Math.max(...runs.map((run) => pct(run.score, run.total))) : 0;

  return (
    <div className="page wrap">
      <div className="history-heading">
        <div>
          <h1>History</h1>
          <p className="muted history-subtitle">Your practice activity and test results</p>
        </div>
        <button className="btn sm danger" onClick={onClear}>Clear history</button>
      </div>
      <div className="grid g4 history-stats" style={{ marginBottom: 20 }}>
        <div className="stat"><div className="v">{seen}<small>/{totalQuestions}</small></div><div className="l">Seen</div></div>
        <div className="stat"><div className="v">{pct(correct, attempts)}%</div><div className="l">Accuracy</div></div>
        <div className="stat"><div className="v">{attempts}</div><div className="l">Attempts</div></div>
        <div className="stat"><div className="v">{totalTests}</div><div className="l">Tests</div></div>
      </div>
      {totalTests > 0 && <div className="row" style={{ gap: 8, marginBottom: 18 }}><span className="badge grey">Average test score {avgAcc}%</span><span className="badge green">Best test {bestAcc}%</span></div>}
      {!runs.length && <div className="card empty"><div className="empty-mark"><Icon name="chart" size={22} /></div><h3>No tests yet</h3><p>Take a practice quiz and it will appear here. Your question-level progress is tracked as you practise.</p></div>}
      <div className="history-list">
        {runs.map((r) => {
          const a = pct(r.score, r.total);
          const cls = a >= 80 ? 'good' : a >= 50 ? 'mid' : 'bad';
          return (
            <div className="hrow" key={r.id}>
              <div className={'score-pill ' + cls} aria-label={`${r.score} out of ${r.total}`}>{r.score}<small>/{r.total}</small></div>
              <div className="history-run-info">
                <div className="history-run-title">{r.modeLabel}</div>
                <div className="tiny history-run-meta">
                  {fmtDate(r.ts)} <span aria-hidden="true">·</span> {a}% <span aria-hidden="true">·</span> {fmtClock(r.total ? r.timeTotal / r.total : 0)} avg
                  {r.skipped ? ' · ' + r.skipped + ' skipped' : ''}
                </div>
              </div>
              <button className="btn sm history-details-btn" onClick={() => setOpen(r)}>Details</button>
            </div>
          );
        })}
      </div>
      {open && <HistoryDetail run={open} qmap={qmap} onClose={() => setOpen(null)} onStudyAssignment={onStudyAssignment} />}
      <AppFooter showReport={true} />
    </div>
  );
}

function CheatsheetView({ subject, progress, onStudy, onPracticeWeak }) {
  const weak = useMemo(() => weakQuestions(subject, progress), [subject, progress]);
  const assignments = subject?.assignments || [];
  const [showAnswers, setShowAnswers] = useState(true);
  const [hideExplanations, setHideExplanations] = useState(false);
  const byAssignment = useMemo(() => {
    const m = {};
    weak.forEach((w) => {
      const k = w.q._aid;
      if (!m[k]) m[k] = { id: k, name: w.q._aname, items: [] };
      m[k].items.push(w);
    });
    return Object.values(m).sort((a, b) => b.items.length - a.items.length);
  }, [weak]);
  const revisionAssignments = useMemo(
    () => assignments.filter((a) => weak.some((w) => w.q._aid === a.id)),
    [assignments, weak]
  );
  const revisionAssignmentKey = revisionAssignments.map((a) => a.id).join('|');
  const [selectedWeekId, setSelectedWeekId] = useState(() => revisionAssignments[0]?.id || '');
  const [showAllRevisionWeeks, setShowAllRevisionWeeks] = useState(false);
  const revisionTabsRef = useRef(null);
  const revisionTabRefs = useRef({});
  const [revisionScrollState, setRevisionScrollState] = useState({ left: false, right: false });

  useEffect(() => {
    if (!revisionAssignments.some((a) => a.id === selectedWeekId)) {
      setSelectedWeekId(revisionAssignments[0]?.id || '');
      setShowAllRevisionWeeks(false);
    }
  }, [subject?.id, selectedWeekId, revisionAssignmentKey]);

  useEffect(() => {
    const container = revisionTabsRef.current;
    const tab = revisionTabRefs.current[selectedWeekId];
    if (!container) return;
    if (tab && !showAllRevisionWeeks) {
      const containerRect = container.getBoundingClientRect();
      const tabRect = tab.getBoundingClientRect();
      let nextLeft = container.scrollLeft;
      if (tabRect.left < containerRect.left + 2) nextLeft += tabRect.left - containerRect.left - 8;
      else if (tabRect.right > containerRect.right - 2) nextLeft += tabRect.right - containerRect.right + 8;
      if (Math.abs(nextLeft - container.scrollLeft) > 1) container.scrollTo({ left: Math.max(0, nextLeft), behavior: 'smooth' });
    }
    const updateScrollState = () => {
      const next = {
        left: container.scrollLeft > 2,
        right: container.scrollLeft + container.clientWidth < container.scrollWidth - 2,
      };
      setRevisionScrollState((current) => current.left === next.left && current.right === next.right ? current : next);
    };
    updateScrollState();
    container.addEventListener('scroll', updateScrollState, { passive: true });
    window.addEventListener('resize', updateScrollState);
    return () => {
      container.removeEventListener('scroll', updateScrollState);
      window.removeEventListener('resize', updateScrollState);
    };
  }, [selectedWeekId, subject?.id, revisionAssignmentKey, showAllRevisionWeeks]);

  const scrollRevisionWeeks = (direction) => {
    const container = revisionTabsRef.current;
    if (!container) return;
    const tab = container.querySelector('.week-tab');
    const step = tab ? tab.getBoundingClientRect().width + 7 : Math.max(160, container.clientWidth * 0.7);
    container.scrollBy({ left: direction * step, behavior: 'smooth' });
  };

  if (!weak.length) {
    return (
      <div className="page wrap">
        <h1 style={{ marginBottom: 20 }}>Cheatsheet</h1>
        <div className="card empty">
          <div className="empty-mark"><Icon name="sparkles" size={22} /></div>
          <h3>No weak spots detected</h3>
          <p>
            {Object.keys(progress.questions).length
              ? 'Keep practising — questions you repeatedly get wrong will appear here.'
              : 'Attempt a few quizzes and your cheatsheet will build itself.'}
          </p>
        </div>
        <AppFooter showReport={true} />
      </div>
    );
  }

  const activeAssignment = revisionAssignments.find((a) => a.id === selectedWeekId) || revisionAssignments[0];
  const activeIndex = Math.max(0, revisionAssignments.findIndex((a) => a.id === activeAssignment?.id));
  const sortWeakForAssignment = (assignment) => assignment
    ? weak.filter((w) => w.q._aid === assignment.id).sort((a, b) =>
        assignment.questions.findIndex((q) => q.id === a.q.id) - assignment.questions.findIndex((q) => q.id === b.q.id))
    : [];
  const weekWeak = sortWeakForAssignment(activeAssignment);
  const allRevisionWeak = revisionAssignments.flatMap((assignment) => sortWeakForAssignment(assignment));
  const visibleRevisionWeak = showAllRevisionWeeks ? allRevisionWeak : weekWeak;

  return (
    <div className="page wrap">
      <div className="cheat-head">
        <div>
          <h1>Cheatsheet</h1>
          <p className="muted" style={{ marginTop: 6 }}>
            {weak.length} weak question{weak.length > 1 ? 's' : ''} detected from your answers
          </p>
        </div>
        <button className="toggle-answers" onClick={() => setShowAnswers(!showAnswers)} aria-pressed={!showAnswers}>
          <Icon name={showAnswers ? 'eyeOff' : 'eye'} size={13} />
          {showAnswers ? 'Hide answers' : 'Show answers'}
        </button>
      </div>
      <div className="card">
        <h3>Focus weeks</h3>
        <p className="muted" style={{ margin: '8px 0 16px' }}>Open a week's notes to study it in full.</p>
        <div className="grid g2" style={{ marginBottom: 16 }}>
          {byAssignment.map((g) => (
            <button className="chk on" key={g.id} onClick={() => onStudy(subject.assignments.find((a) => a.id === g.id))}>
              <span className="box">✓</span>
              <span style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                <span style={{ display: 'block', fontWeight: 500, fontSize: 'var(--fs-sm)' }}>{g.name}</span>
                <span className="tiny">{g.items.length} weak question{g.items.length > 1 ? 's' : ''}</span>
              </span>
              <span style={{ color: 'var(--muted)' }}><Icon name="book" size={15} /></span>
            </button>
          ))}
        </div>
        <button className="btn primary block" onClick={onPracticeWeak}>
          <Icon name="play" size={13} /> Drill all {weak.length} weak questions
        </button>
      </div>

      <h2 className="section-title">Revision notes</h2>
      <div className="revision-nav-layout">
        <div className="notes-toolbar revision-week-toolbar" aria-label="Revision week navigation">
          <div className="week-pager">
            <div className="week-tabs-shell" role="group" aria-label="Scrollable revision week selector">
              <button type="button" className="week-scroll-arrow" aria-label="Scroll to previous revision weeks"
                disabled={!revisionScrollState.left} onClick={() => scrollRevisionWeeks(-1)}>
                <span aria-hidden="true" className="week-arrow-glyph">&lt;</span>
              </button>
              <div ref={revisionTabsRef} className="week-tabs revision-week-tabs" role="tablist" aria-label="Choose a week with revision notes"
                style={{
                  '--revision-tab-count': Math.max(1, revisionAssignments.length),
                  '--revision-slot-width': Math.min(3, revisionAssignments.length) === 1 ? '100%' : (Math.min(3, revisionAssignments.length) === 2 ? 'calc(50% - 3px)' : 'calc(33.333333% - 4px)')
                }}>
                {revisionAssignments.map((item) => (
                  <button
                    key={item.id}
                    ref={(el) => { revisionTabRefs.current[item.id] = el; }}
                    role="tab"
                    aria-selected={!showAllRevisionWeeks && item.id === activeAssignment?.id}
                    className={'week-tab' + (!showAllRevisionWeeks && item.id === activeAssignment?.id ? ' active' : '')}
                    onClick={() => { setSelectedWeekId(item.id); setShowAllRevisionWeeks(false); }}
                    title={item.name}
                  >
                    <span>{item.name}</span>
                  </button>
                ))}
              </div>
              <button type="button" className="week-scroll-arrow" aria-label="Scroll to later revision weeks"
                disabled={!revisionScrollState.right} onClick={() => scrollRevisionWeeks(1)}>
                <span aria-hidden="true" className="week-arrow-glyph">&gt;</span>
              </button>
            </div>
          </div>
        </div>
        <button type="button" className={'btn sm revision-all-weeks' + (showAllRevisionWeeks ? ' active' : '')}
          aria-pressed={showAllRevisionWeeks}
          onClick={() => setShowAllRevisionWeeks((value) => !value)}>
          <Icon name={showAllRevisionWeeks ? 'check' : 'layers'} size={13} />
          {showAllRevisionWeeks ? 'All weeks shown' : 'Show all weeks'}
        </button>
      </div>

      <div className="notes-controls revision-notes-controls">
        <div>
          <h3>{showAllRevisionWeeks ? 'All weeks · Revision notes' : (activeAssignment?.name || 'Revision notes')}</h3>
          <div className="notes-question-count" style={{ marginTop: 4 }}>
            {showAllRevisionWeeks
              ? `${visibleRevisionWeak.length} weak question${visibleRevisionWeak.length === 1 ? '' : 's'} across ${revisionAssignments.length} week${revisionAssignments.length === 1 ? '' : 's'}`
              : `${visibleRevisionWeak.length} weak question${visibleRevisionWeak.length === 1 ? '' : 's'} in this week`}
          </div>
        </div>
        <label className="row notes-explanation-toggle" style={{ gap: 8, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
          <Switch on={hideExplanations} onChange={setHideExplanations} />
          <span>{hideExplanations ? 'Explanations hidden' : 'Hide explanations'}</span>
        </label>
      </div>

      {visibleRevisionWeak.length === 0 ? (
        <div className="card empty revision-empty">
          <div className="empty-mark"><Icon name="book" size={21} /></div>
          <h3>No weak questions in {activeAssignment?.name || 'this week'}</h3>
          <p>Questions you repeatedly get wrong from this week will appear here as you practise.</p>
        </div>
      ) : visibleRevisionWeak.map(({ q, st }) => {
        const ans = answerIndices(q);
        return (
          <div className="card note" key={q.id} style={{ marginBottom: 12 }}>
            <div className="note-head">
              <span className="qnum">wrong {st.w}×</span>
              <span className="badge grey">{q._aname}</span>
              <span className="badge red" style={{ marginLeft: 'auto' }}>{pct(st.c, st.a)}%</span>
            </div>
            <div className="qtext" style={{ fontSize: 'var(--fs-sm)' }}><FormattedText text={q.question} /></div>
            {showAnswers ? (
              <>
                <ul className="opts">
                  {q.options.map((o, j) => (
                    <li key={j} className={ans.includes(j) ? 'ans' : ''}>
                      <span className="tag">{String.fromCharCode(65 + j)}</span>
                      <span style={{ flex: 1 }}><FormattedText text={typeof o === 'string' ? o : (o.text || o.label || '')} /></span>
                      {ans.includes(j) && <span className="tick">✓</span>}
                    </li>
                  ))}
                </ul>
                {!hideExplanations && q.explanation && <div className="explain"><b>Why:</b> <FormattedText text={q.explanation} /></div>}
              </>
            ) : (
              <button className="btn sm" onClick={() => setShowAnswers(true)}>
                <Icon name="eye" size={13} /> Reveal answers
              </button>
            )}
          </div>
        );
      })}

      {!showAllRevisionWeeks && <div className="row between notes-week-next-actions" style={{ marginTop: 20, gap: 10 }}>
        <button className="btn" disabled={activeIndex === 0} onClick={() => setSelectedWeekId(revisionAssignments[activeIndex - 1].id)}><Icon name="arrowL" size={13} /> Previous week</button>
        <button className="btn primary" disabled={activeIndex >= revisionAssignments.length - 1} onClick={() => setSelectedWeekId(revisionAssignments[activeIndex + 1].id)}>Next week <Icon name="arrowR" size={13} /></button>
      </div>}
      <AppFooter showReport={true} />
    </div>
  );
}

function NotesView({ subject, assignment, progress, onPractice }) {
  const assignments = subject?.assignments || [];
  const [selectedId, setSelectedId] = useState(assignment?.id || assignments[0]?.id || '');
  const [hideExplanations, setHideExplanations] = useState(false);
  const weekTabRefs = useRef({});
  const weekTabsContainerRef = useRef(null);
  const [weekScrollState, setWeekScrollState] = useState({ left: false, right: false });

  useEffect(() => {
    if (assignment?.id) setSelectedId(assignment.id);
    else if (!selectedId && assignments[0]) setSelectedId(assignments[0].id);
  }, [assignment?.id, subject?.id]);

  useEffect(() => {
    const container = weekTabsContainerRef.current;
    const activeTab = weekTabRefs.current[selectedId];
    if (!container || !activeTab) return;
    const containerRect = container.getBoundingClientRect();
    const tabRect = activeTab.getBoundingClientRect();
    let nextScrollLeft = container.scrollLeft;
    if (tabRect.left < containerRect.left + 2) {
      nextScrollLeft += tabRect.left - containerRect.left - 8;
    } else if (tabRect.right > containerRect.right - 2) {
      nextScrollLeft += tabRect.right - containerRect.right + 8;
    }
    if (Math.abs(nextScrollLeft - container.scrollLeft) > 1) {
      container.scrollTo({ left: Math.max(0, nextScrollLeft), behavior: 'smooth' });
    }
    const updateScrollState = () => {
      const next = {
        left: container.scrollLeft > 2,
        right: container.scrollLeft + container.clientWidth < container.scrollWidth - 2,
      };
      setWeekScrollState((current) => current.left === next.left && current.right === next.right ? current : next);
    };
    updateScrollState();
    container.addEventListener('scroll', updateScrollState, { passive: true });
    window.addEventListener('resize', updateScrollState);
    return () => {
      container.removeEventListener('scroll', updateScrollState);
      window.removeEventListener('resize', updateScrollState);
    };
  }, [selectedId, subject?.id, assignments.length]);

  const scrollNotesWeeks = (direction) => {
    const container = weekTabsContainerRef.current;
    if (!container) return;
    const tab = container.querySelector('.week-tab');
    const step = tab ? tab.getBoundingClientRect().width + 7 : Math.max(160, container.clientWidth * 0.7);
    container.scrollBy({ left: direction * step, behavior: 'smooth' });
  };

  if (!assignments.length) return <div className="page wrap"><h1>Notes</h1><div className="card empty"><h3>No notes available</h3><p>There are no weekly assignments available for this subject yet.</p></div></div>;

  const activeIndex = Math.max(0, assignments.findIndex((item) => item.id === selectedId));
  const active = assignments[activeIndex] || assignments[0];
  const selectAssignment = (item) => setSelectedId(item.id);

  return (
    <div className="page wrap">
      <div className="notes-page-heading">
        <div className="notes-page-heading-copy">
          <h1>Notes & answers</h1>
          <p className="muted" style={{ marginTop: 6 }}>{subject.title} · Browse questions and correct answers across all weeks.</p>
        </div>
        <button className="btn primary sm notes-practice-button" onClick={() => onPractice(active.id, active.questions.length)}><Icon name="play" size={12} /> Practise week</button>
      </div>

      <div className="notes-toolbar" aria-label="Week navigation">
        <div className="week-pager">
          <div className="week-tabs-shell" role="group" aria-label="Scrollable week selector">
            <button type="button" className="week-scroll-arrow" aria-label="Scroll to previous weeks"
              disabled={!weekScrollState.left} onClick={() => scrollNotesWeeks(-1)}>
              <span aria-hidden="true" className="week-arrow-glyph">&lt;</span>
            </button>
            <div ref={weekTabsContainerRef} className="week-tabs" role="tablist" aria-label="Choose week">
              {assignments.map((item) => (
                <button
                  key={item.id}
                  ref={(el) => { weekTabRefs.current[item.id] = el; }}
                  data-week-id={item.id}
                  role="tab"
                  aria-selected={item.id === active.id}
                  className={'week-tab' + (item.id === active.id ? ' active' : '')}
                  onClick={() => selectAssignment(item)}
                  title={item.name}
                >{item.name}</button>
              ))}
            </div>
            <button type="button" className="week-scroll-arrow" aria-label="Scroll to later weeks"
              disabled={!weekScrollState.right} onClick={() => scrollNotesWeeks(1)}>
              <span aria-hidden="true" className="week-arrow-glyph">&gt;</span>
            </button>
          </div>
        </div>
      </div>
      <div className="notes-controls">
        <div>
          <h2 style={{ fontSize: 'var(--fs-lg)' }}>{active.name}</h2>
          <div className="notes-question-count" style={{ marginTop: 4 }}>{active.questions.length} questions · Correct answers highlighted</div>
        </div>
        <label className="row notes-explanation-toggle" style={{ gap: 8, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
          <Switch on={hideExplanations} onChange={setHideExplanations} />
          <span>{hideExplanations ? 'Explanations hidden' : 'Hide explanations'}</span>
        </label>
      </div>

      {active.questions.map((q, i) => {
        const st = progress.questions[q.id];
        const ans = answerIndices(q);
        return (
          <div className="card note" key={q.id} style={{ marginBottom: 12 }}>
            <div className="note-head">
              <span className="qnum">Q{i + 1}</span>
              {st && st.w > 0 && <span className="badge red">wrong {st.w}×</span>}
              {st && st.c > 0 && <span className="badge green">right {st.c}×</span>}
              {!st && <span className="badge grey">new</span>}
            </div>
            <div className="qtext"><FormattedText text={q.question} /></div>
            <ul className="opts">
              {q.options.map((o, j) => (
                <li key={j} className={ans.includes(j) ? 'ans' : ''}>
                  <span className="tag">{String.fromCharCode(65 + j)}</span>
                  <span style={{ flex: 1 }}><FormattedText text={typeof o === 'string' ? o : (o.text || o.label || '')} /></span>
                  {ans.includes(j) && <span className="tick">✓</span>}
                </li>
              ))}
            </ul>
            {!hideExplanations && q.explanation && <div className="explain"><b>Why:</b> <FormattedText text={q.explanation} /></div>}
          </div>
        );
      })}
      <div className="row between notes-week-next-actions" style={{ marginTop: 20, gap: 10 }}>
        <button className="btn" disabled={activeIndex === 0} onClick={() => selectAssignment(assignments[activeIndex - 1])}><Icon name="arrowL" size={13} /> Previous week</button>
        <button className="btn primary" disabled={activeIndex >= assignments.length - 1} onClick={() => selectAssignment(assignments[activeIndex + 1])}>Next week <Icon name="arrowR" size={13} /></button>
      </div>
      <AppFooter showReport={true} />
    </div>
  );
}
