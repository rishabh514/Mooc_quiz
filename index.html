function AchievementPanel({ progress, qmap, subject, achievements }) {
  const [showXPLevels, setShowXPLevels] = useState(false);
  const [levelMetadata, setLevelMetadata] = useState(DEFAULT_LEVELS);
  useEffect(() => {
    let cancelled = false;
    fetch('./assets/level.json')
      .then((response) => { if (!response.ok) throw new Error('Could not load level metadata'); return response.json(); })
      .then((data) => { if (!cancelled) setLevelMetadata(normalizeLevels(data)); })
      .catch((error) => console.warn('Mooc Mastery level metadata could not be loaded. Check assets/level.json. Using fallback levels.', error));
    return () => { cancelled = true; };
  }, []);
  const dates = achievements?.activityDates || [];
  const streak = streakSummary(dates);
  // Legacy versions saved completed attempts under the subject progress key, while
  // the newer achievement ledger uses a separate key. Merge both sources so existing
  // players keep their badge history; prefer the richer achievement-ledger record.
  const achievementRuns = achievements?.history || [];
  const legacyRuns = (progress?.history || []).map((run) => ({ ...run, subjectId: run.subjectId || subject?.id }));
  const runById = new Map();
  [...legacyRuns, ...achievementRuns].forEach((run) => {
    const key = run.id || `${run.subjectId || subject?.id}:${run.ts || 0}:${run.modeLabel || run.mode || ''}:${run.total || 0}`;
    const existing = runById.get(key);
    if (!existing || ((run.items || []).length > (existing.items || []).length)) runById.set(key, run);
  });
  const allRuns = [...runById.values()].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const scorePct = (run) => run && run.total > 0 ? pct(run.score, run.total) : 0;
  const runAnswered = (run) => (run?.items || []).filter((item) => !item.skipped);
  const anyRun = (test) => allRuns.some(test);
  const currentSubjectRuns = allRuns.filter((run) => (run.subjectId || subject?.id) === subject?.id);
  const questionAttemptTotal = Object.values(progress?.questions || {}).reduce((sum, stat) => sum + Math.max(0, Number(stat?.a) || 0), 0);
  const historyAnsweredTotal = allRuns.reduce((sum, run) => sum + (runAnswered(run).length || (run.items ? 0 : Math.max(0, Number(run.total) || 0) - Math.max(0, Number(run.skipped) || 0))), 0);
  const totalAnswered = Math.max(0, Number(achievements?.totalAnswered) || 0, questionAttemptTotal, historyAnsweredTotal);
  const comeback = currentSubjectRuns.some((later, i) => currentSubjectRuns.slice(0, i).some((earlier) =>
    (later.mode || '') === (earlier.mode || '') && (later.assignmentIds || []).join('|') === (earlier.assignmentIds || []).join('|') && scorePct(later) >= scorePct(earlier) + 20
  ));
  const assignments = subject?.assignments || [];
  const regularAssignments = assignments.filter((assignment) => !/\bextras?\b/i.test(String(assignment.name || '')));
  const coveredAssignmentIds = new Set();
  currentSubjectRuns.forEach((run) => (run.items || []).forEach((item) => {
    const question = qmap[item.qid];
    if (!item.skipped && question?._aid && regularAssignments.some((assignment) => assignment.id === question._aid)) coveredAssignmentIds.add(question._aid);
  }));
  const weekConqueror = regularAssignments.length > 0 && regularAssignments.every((assignment) => coveredAssignmentIds.has(assignment.id));
  // Mastery is persisted separately from the capped history list, so older correct
  // attempts remain credited even after their quiz runs roll out of history.
  const correctlySolvedQuestionIds = new Set(achievements?.masteredQuestionIdsBySubject?.[subject?.id] || []);
  // Backfill mastery from any retained legacy history for users upgrading this version.
  currentSubjectRuns.forEach((run) => (run.items || []).forEach((item) => {
    if (!item.skipped && item.correct && qmap[item.qid]) correctlySolvedQuestionIds.add(item.qid);
  }));
  const allRegularQuestionsSolved = regularAssignments.length > 0 && regularAssignments.every((assignment) =>
    assignment.questions.every((question) => correctlySolvedQuestionIds.has(question.id))
  );
  const apexOverlord = totalAnswered >= 1000 && allRegularQuestionsSolved;
  // Badge display metadata is loaded from /assets/badges.json; unlock rules stay here.
  const [badgeMetadata, setBadgeMetadata] = useState({ badges: [], streakMilestones: [] });
  useEffect(() => {
    let cancelled = false;
    fetch('./assets/badges.json')
      .then((response) => { if (!response.ok) throw new Error('Could not load badge metadata'); return response.json(); })
      .then((data) => { if (!cancelled && data && Array.isArray(data.badges)) setBadgeMetadata({ badges: data.badges, streakMilestones: Array.isArray(data.streakMilestones) ? data.streakMilestones : [] }); })
      .catch((error) => console.warn('Mooc Mastery badge metadata could not be loaded. Check assets/badges.json.', error));
    return () => { cancelled = true; };
  }, []);
  const bestScore = (runs, test = () => true) => runs.filter((run) => test(run) && run.total > 0).reduce((best, run) => Math.max(best, scorePct(run)), 0);
  const bestSpeed = (runs) => runs.reduce((best, run) => {
    const answered = runAnswered(run);
    if (!answered.length) return best;
    const seconds = answered.reduce((sum, item) => sum + (item.timeMs || 0), 0) / answered.length / 1000;
    return Math.min(best, seconds);
  }, Infinity);
  const maxComeback = currentSubjectRuns.reduce((best, later, i) => Math.max(best, ...currentSubjectRuns.slice(0, i).filter((earlier) => (later.mode || '') === (earlier.mode || '') && (later.assignmentIds || []).join('|') === (earlier.assignmentIds || []).join('|')).map((earlier) => scorePct(later) - scorePct(earlier)), 0), 0);
  const progressItem = (label, current, target, format = (v) => `${Math.round(v)}/${target}`) => ({ label, value: Math.max(0, Math.min(100, target > 0 ? current / target * 100 : 0)), display: format(current) });
  const streakProgress = (target) => progressItem('Consecutive active days', streak.longest, target, (v) => `${Math.min(v, target)}/${target} days`);
  const coveredWeeksPct = regularAssignments.length ? coveredAssignmentIds.size / regularAssignments.length * 100 : 0;
  const masteredRegularTotal = regularAssignments.reduce((sum, assignment) => sum + assignment.questions.length, 0);
  const masteredRegularCount = regularAssignments.reduce((sum, assignment) => sum + assignment.questions.filter((question) => correctlySolvedQuestionIds.has(question.id)).length, 0);
  const badgeRules = [
    { id: 'precision-sniper', repeatCount: allRuns.filter((run) => scorePct(run) >= 90).length, earned: anyRun((run) => scorePct(run) >= 90), progress: [progressItem('Best quiz score', bestScore(allRuns), 90, (v) => `${Math.round(v)}% / 90%`)] },
    { id: 'flawless-gladiator', repeatCount: allRuns.filter((run) => run.total > 0 && scorePct(run) === 100 && !(run.skipped || 0)).length, earned: anyRun((run) => run.total > 0 && scorePct(run) === 100 && !(run.skipped || 0)), progress: [progressItem('Quiz accuracy', bestScore(allRuns), 100, (v) => `${Math.round(v)}% / 100%`), progressItem('No skipped questions in a quiz', allRuns.some((run) => run.total > 0 && !(run.skipped || 0)) ? 1 : 0, 1, (v) => v ? 'Met' : 'Not yet')] },
    { id: 'week-conqueror', earned: weekConqueror, progress: [progressItem('Regular weeks attempted', coveredAssignmentIds.size, regularAssignments.length, (v) => `${Math.min(v, regularAssignments.length)}/${regularAssignments.length} weeks`)] },
    { id: 'comeback-king', earned: comeback, progress: [progressItem('Score improvement', maxComeback, 20, (v) => `${Math.max(0, Math.round(v))} / 20 percentage points`)] },
    { id: 'phoenix-rising', repeatCount: allRuns.filter((run) => run.mode === 'weak' && scorePct(run) >= 80).length, earned: anyRun((run) => run.mode === 'weak' && scorePct(run) >= 80), progress: [progressItem('Best Weak Questions score', bestScore(allRuns, (run) => run.mode === 'weak'), 80, (v) => `${Math.round(v)}% / 80%`)] },
    { id: 'speed-demon', repeatCount: allRuns.filter((run) => { const answered = runAnswered(run); const avgMs = answered.length ? answered.reduce((sum, item) => sum + (Number(item.timeMs) || 0), 0) / answered.length : (run.total > 0 && Number(run.timeTotal) > 0 ? Number(run.timeTotal) / run.total : Infinity); return scorePct(run) >= 90 && avgMs <= 20000; }).length, earned: anyRun((run) => { const answered = runAnswered(run); const avgMs = answered.length ? answered.reduce((sum, item) => sum + (Number(item.timeMs) || 0), 0) / answered.length : (run.total > 0 && Number(run.timeTotal) > 0 ? Number(run.timeTotal) / run.total : Infinity); return scorePct(run) >= 90 && avgMs <= 20000; }), progress: [progressItem('Quiz accuracy', bestScore(allRuns), 90, (v) => `${Math.round(v)}% / 90%`), progressItem('Average answer speed', Number.isFinite(bestSpeed(allRuns)) ? Math.max(0, 20 - bestSpeed(allRuns)) : 0, 20, (v) => Number.isFinite(bestSpeed(allRuns)) ? `${Math.max(0, bestSpeed(allRuns)).toFixed(1)}s / ≤20s` : 'No timed data yet')] },
    { id: 'first-blood', earned: totalAnswered >= 100, progress: [progressItem('Questions answered', totalAnswered, 100)] },
    { id: 'question-slayer', earned: totalAnswered >= 200, progress: [progressItem('Questions answered', totalAnswered, 200)] },
    { id: 'mind-gladiator', earned: totalAnswered >= 300, progress: [progressItem('Questions answered', totalAnswered, 300)] },
    { id: 'knowledge-dominator', earned: totalAnswered >= 500, progress: [progressItem('Questions answered', totalAnswered, 500)] },
    { id: 'apex-overlord', earned: apexOverlord, progress: [progressItem('Questions answered', totalAnswered, 1000), progressItem('Regular-week questions mastered', masteredRegularCount, masteredRegularTotal, (v) => `${v}/${masteredRegularTotal} correct`)] },
    { id: 'hot-streak', earned: streak.longest >= 1, progress: [streakProgress(1)] },
    { id: 'unstoppable', earned: streak.longest >= 2, progress: [streakProgress(2)] },
    { id: 'iron-will', earned: streak.longest >= 3, progress: [streakProgress(3)] },
  ];
  const metadataById = Object.fromEntries((badgeMetadata.badges || []).map((badge) => [badge.id, badge]));
  const badgeList = badgeRules.map((rule) => ({ ...(metadataById[rule.id] || { id: rule.id, name: rule.id, description: '' }), ...rule }));
  const earnedCount = badgeList.filter((badge) => badge.earned).length;
  const repeatableXp = allRuns.reduce((sum, run) => sum + qualifyingRepeatableBadges(run).reduce((n, badge) => n + badge.xp, 0), 0);
  const oneTimeXp = badgeList.filter((badge) => badge.earned && !['precision-sniper','flawless-gladiator','phoenix-rising','speed-demon'].includes(badge.id)).reduce((sum, badge) => sum + (BADGE_XP[badge.id] || 0), 0);
  const totalXp = Math.min(MAX_LEVEL_XP, repeatableXp + oneTimeXp);
  return (
    <section className="achievement-section" aria-labelledby="achievements-title">
      <div className="achievement-section-head">
        <div><h2 id="achievements-title">Your Hall of Fame</h2><p>Earn field marks for accuracy, course mastery and consistent practice.</p></div>
        <span className="badge blue">{earnedCount}/{badgeList.length} unlocked</span>
      </div>
      <div className="streak-panel">
        <XPProgressCard totalXp={totalXp} levels={levelMetadata} onInfo={() => setShowXPLevels(true)} />
        <div className="streak-side">
          <div className="streak-side-row"><span>Current streak</span><strong>{streak.current} day{streak.current === 1 ? '' : 's'}</strong></div>
          <div className="streak-side-row"><span>Longest streak</span><strong>{streak.longest} day{streak.longest === 1 ? '' : 's'}</strong></div>
          <div className="streak-side-row"><span>Active days</span><strong>{new Set(dates).size}</strong></div>
          <div className="streak-side-row"><span>Questions answered</span><strong>{totalAnswered.toLocaleString()}</strong></div>
          <div className="streak-note">Multiple quizzes on one day count as one active day. Practise on consecutive calendar days to build your streak.</div>
        </div>
      </div>
      {showXPLevels && <XPLevelsModal totalXp={totalXp} levels={levelMetadata} onClose={() => setShowXPLevels(false)} />}
      <div className="achievement-section-head"><div><h2>Badges</h2><p>Question-count badges reward answered questions, not skipped ones. The Apex Overlord also requires full regular-week mastery.</p></div></div>
      <div className="achievement-grid">
        {badgeList.map((badge) => <article key={badge.id} className={'achievement-card ' + (badge.earned ? 'is-earned' : 'is-locked')}>
          <img className="achievement-icon" src={badgeImagePath(badge.image, badge.id + '.png')} alt={badge.name || ''} loading="lazy" />
          <div className="achievement-copy"><div className="achievement-name-row"><div className="achievement-name">{badge.name}</div><span className="badge-xp-reward">+{BADGE_XP[badge.id] || 0} XP{['precision-sniper','flawless-gladiator','phoenix-rising','speed-demon'].includes(badge.id) ? ' each' : ''}</span></div><div className="achievement-desc">{badge.description}</div>{!badge.earned && badge.progress?.length > 0 && <div className="achievement-progress-list" aria-label={badge.name + ' progress'}>{badge.progress.map((item, index) => <div className="achievement-progress-item" key={index}><div className="achievement-progress-label"><span>{item.label}</span><strong>{item.display}</strong></div><div className="achievement-progress-track" role="progressbar" aria-label={item.label} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(item.value)}><div className="achievement-progress-fill" style={{width: item.value + '%'}} /></div></div>)}</div>}<div className="achievement-status">{badge.earned ? ('✓ Unlocked' + (badge.repeatCount > 0 ? ' · ×' + badge.repeatCount + ' earned' : '')) : 'Not yet unlocked'}</div></div>
        </article>)}
      </div>
    </section>
  );
}

function HistoryView({ progress, qmap, totalQuestions, onStudyAssignment, onClear, subject, achievements }) {
  const [open, setOpen] = useState(null);
  const [activeTab, setActiveTab] = useState('attempts');
  const runs = progress.history || [];
  const qStats = progress.questions || {};
  const seen = Object.keys(qStats).length;
  const attempts = Object.values(qStats).reduce((sum, stat) => sum + (stat.a || 0), 0);
  const correct = Object.values(qStats).reduce((sum, stat) => sum + (stat.c || 0), 0);
  const totalTests = runs.length;
  const avgAcc = totalTests ? Math.round(runs.reduce((sum, run) => sum + pct(run.score, run.total), 0) / totalTests) : 0;
  const bestAcc = totalTests ? Math.max(...runs.map((run) => pct(run.score, run.total))) : 0;

  return (
    <div className="page wrap">
      <div className="history-heading">
        <div>
          <h1>History</h1>
          <p className="muted history-subtitle">Your practice activity, test results and achievements</p>
        </div>
        <button className="btn sm danger" onClick={onClear}>Clear history</button>
      </div>
      <div className="history-tabs" role="tablist" aria-label="History sections">
        <button type="button" role="tab" aria-selected={activeTab === 'attempts'} className={'history-tab ' + (activeTab === 'attempts' ? 'active' : '')} onClick={() => setActiveTab('attempts')}>
          Attempt history <span>{totalTests}</span>
        </button>
        <button type="button" role="tab" aria-selected={activeTab === 'stats'} className={'history-tab ' + (activeTab === 'stats' ? 'active' : '')} onClick={() => setActiveTab('stats')}>
          Stats & badges
        </button>
      </div>
      {activeTab === 'attempts' ? <>
        <div className="grid g4 history-stats" style={{ marginBottom: 20 }}>
          <div className="stat"><div className="v">{seen}<small>/{totalQuestions}</small></div><div className="l">Seen</div></div>
          <div className="stat"><div className="v">{pct(correct, attempts)}%</div><div className="l">Accuracy</div></div>
          <div className="stat"><div className="v">{attempts}</div><div className="l">Attempts</div></div>
          <div className="stat"><div className="v">{totalTests}</div><div className="l">Tests</div></div>
        </div>
        {totalTests > 0 && <div className="row" style={{ gap: 8, marginBottom: 18 }}><span className="badge grey">Average test score {avgAcc}%</span><span className="badge green">Best test {bestAcc}%</span></div>}
        <div className="history-attempts-head"><h2>Attempt history</h2><span className="muted">{totalTests} test{totalTests === 1 ? '' : 's'}</span></div>
        {!runs.length && <div className="card empty"><div className="empty-mark"><Icon name="chart" size={22} /></div><h3>No tests yet</h3><p>Take a practice quiz and it will appear here. Your question-level progress is tracked as you practise.</p></div>}
        <div className="history-list">
          {runs.map((r) => {
            const a = pct(r.score, r.total);
            const cls = a >= 80 ? 'good' : a >= 50 ? 'mid' : 'bad';
            return (
              <div className="hrow" key={r.id}>
                <div className={'score-pill ' + cls} aria-label={`${r.score} out of ${r.total}`}>{r.score}<small>/{r.total}</small></div>
                <div className="history-run-info">
                  <div className="history-run-title">{r.modeLabel}</div>
                  <div className="tiny history-run-meta">
                    {fmtDate(r.ts)} <span aria-hidden="true">·</span> {a}% <span aria-hidden="true">·</span> {fmtClock(r.total ? r.timeTotal / r.total : 0)} avg
                    {r.skipped ? ' · ' + r.skipped + ' skipped' : ''}
                  </div>
                </div>
                <button className="btn sm history-details-btn" onClick={() => setOpen(r)}>Details</button>
              </div>
            );
          })}
        </div>
        {open && <HistoryDetail run={open} qmap={qmap} onClose={() => setOpen(null)} onStudyAssignment={onStudyAssignment} achievements={achievements} />}
      </> : <AchievementPanel progress={progress} qmap={qmap} subject={subject} achievements={achievements} />}
      <AppFooter showReport={true} />
    </div>
  );
}

function CheatsheetView({ subject, progress, onStudy, onPracticeWeak }) {
  const weak = useMemo(() => weakQuestions(subject, progress), [subject, progress]);
  const assignments = subject?.assignments || [];
  const [showAnswers, setShowAnswers] = useState(true);
  const [hideExplanations, setHideExplanations] = useState(false);
  const byAssignment = useMemo(() => {
    const m = {};
    weak.forEach((w) => {
      const k = w.q._aid;
      if (!m[k]) m[k] = { id: k, name: w.q._aname, items: [] };
      m[k].items.push(w);
    });
    return Object.values(m).sort((a, b) => b.items.length - a.items.length);
  }, [weak]);
  const revisionAssignments = useMemo(
    () => assignments.filter((a) => weak.some((w) => w.q._aid === a.id)),
    [assignments, weak]
  );
  const revisionAssignmentKey = revisionAssignments.map((a) => a.id).join('|');
  const [selectedWeekId, setSelectedWeekId] = useState(() => revisionAssignments[0]?.id || '');
  const [showAllRevisionWeeks, setShowAllRevisionWeeks] = useState(false);
  const revisionTabsRef = useRef(null);
  const revisionTabRefs = useRef({});
  const [revisionScrollState, setRevisionScrollState] = useState({ left: false, right: false });

  useEffect(() => {
    if (!revisionAssignments.some((a) => a.id === selectedWeekId)) {
      setSelectedWeekId(revisionAssignments[0]?.id || '');
      setShowAllRevisionWeeks(false);
    }
  }, [subject?.id, selectedWeekId, revisionAssignmentKey]);

  useEffect(() => {
    const container = revisionTabsRef.current;
    const tab = revisionTabRefs.current[selectedWeekId];
    if (!container) return;
    if (tab && !showAllRevisionWeeks) {
      const containerRect = container.getBoundingClientRect();
      const tabRect = tab.getBoundingClientRect();
      let nextLeft = container.scrollLeft;
      if (tabRect.left < containerRect.left + 2) nextLeft += tabRect.left - containerRect.left - 8;
      else if (tabRect.right > containerRect.right - 2) nextLeft += tabRect.right - containerRect.right + 8;
      if (Math.abs(nextLeft - container.scrollLeft) > 1) container.scrollTo({ left: Math.max(0, nextLeft), behavior: 'smooth' });
    }
    const updateScrollState = () => {
      const next = {
        left: container.scrollLeft > 2,
        right: container.scrollLeft + container.clientWidth < container.scrollWidth - 2,
      };
      setRevisionScrollState((current) => current.left === next.left && current.right === next.right ? current : next);
    };
    updateScrollState();
    container.addEventListener('scroll', updateScrollState, { passive: true });
    window.addEventListener('resize', updateScrollState);
    return () => {
      container.removeEventListener('scroll', updateScrollState);
      window.removeEventListener('resize', updateScrollState);
    };
  }, [selectedWeekId, subject?.id, revisionAssignmentKey, showAllRevisionWeeks]);

  const scrollRevisionWeeks = (direction) => {
    const container = revisionTabsRef.current;
    if (!container) return;
    const tab = container.querySelector('.week-tab');
    const step = tab ? tab.getBoundingClientRect().width + 7 : Math.max(160, container.clientWidth * 0.7);
    container.scrollBy({ left: direction * step, behavior: 'smooth' });
  };

  if (!weak.length) {
    return (
      <div className="page wrap">
        <h1 style={{ marginBottom: 20 }}>Cheatsheet</h1>
        <div className="card empty">
          <div className="empty-mark"><Icon name="sparkles" size={22} /></div>
          <h3>No weak spots detected</h3>
          <p>
            {Object.keys(progress.questions).length
              ? 'Keep practising — questions you repeatedly get wrong will appear here.'
              : 'Attempt a few quizzes and your cheatsheet will build itself.'}
          </p>
        </div>
        <AppFooter showReport={true} />
      </div>
    );
  }

  const activeAssignment = revisionAssignments.find((a) => a.id === selectedWeekId) || revisionAssignments[0];
  const activeIndex = Math.max(0, revisionAssignments.findIndex((a) => a.id === activeAssignment?.id));
  const sortWeakForAssignment = (assignment) => assignment
    ? weak.filter((w) => w.q._aid === assignment.id).sort((a, b) =>
        assignment.questions.findIndex((q) => q.id === a.q.id) - assignment.questions.findIndex((q) => q.id === b.q.id))
    : [];
  const weekWeak = sortWeakForAssignment(activeAssignment);
  const allRevisionWeak = revisionAssignments.flatMap((assignment) => sortWeakForAssignment(assignment));
  const visibleRevisionWeak = showAllRevisionWeeks ? allRevisionWeak : weekWeak;

  return (
    <div className="page wrap">
      <div className="cheat-head">
        <div>
          <h1>Cheatsheet</h1>
          <p className="muted" style={{ marginTop: 6 }}>
            {weak.length} weak question{weak.length > 1 ? 's' : ''} detected from your answers
          </p>
        </div>
        <button className="toggle-answers" onClick={() => setShowAnswers(!showAnswers)} aria-pressed={!showAnswers}>
          <Icon name={showAnswers ? 'eyeOff' : 'eye'} size={13} />
          {showAnswers ? 'Hide answers' : 'Show answers'}
        </button>
      </div>
      <div className="card">
        <h3>Focus weeks</h3>
        <p className="muted" style={{ margin: '8px 0 16px' }}>Open a week's notes to study it in full.</p>
        <div className="grid g2" style={{ marginBottom: 16 }}>
          {byAssignment.map((g) => (
            <button className="chk on" key={g.id} onClick={() => onStudy(subject.assignments.find((a) => a.id === g.id))}>
              <span className="box">✓</span>
              <span style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                <span style={{ display: 'block', fontWeight: 500, fontSize: 'var(--fs-sm)' }}>{g.name}</span>
                <span className="tiny">{g.items.length} weak question{g.items.length > 1 ? 's' : ''}</span>
              </span>
              <span style={{ color: 'var(--muted)' }}><Icon name="book" size={15} /></span>
            </button>
          ))}
        </div>
        <button className="btn primary block" onClick={onPracticeWeak}>
          <Icon name="play" size={13} /> Drill all {weak.length} weak questions
        </button>
      </div>

      <h2 className="section-title">Revision notes</h2>
      <div className="revision-nav-layout">
        <div className="notes-toolbar revision-week-toolbar" aria-label="Revision week navigation">
          <div className="week-pager">
            <div className="week-tabs-shell" role="group" aria-label="Scrollable revision week selector">
              <button type="button" className="week-scroll-arrow" aria-label="Scroll to previous revision weeks"
                disabled={!revisionScrollState.left} onClick={() => scrollRevisionWeeks(-1)}>
                <span aria-hidden="true" className="week-arrow-glyph">&lt;</span>
              </button>
              <div ref={revisionTabsRef} className="week-tabs revision-week-tabs" role="tablist" aria-label="Choose a week with revision notes"
                style={{
                  '--revision-tab-count': Math.max(1, revisionAssignments.length),
                  '--revision-slot-width': Math.min(3, revisionAssignments.length) === 1 ? '100%' : (Math.min(3, revisionAssignments.length) === 2 ? 'calc(50% - 3px)' : 'calc(33.333333% - 4px)')
                }}>
                {revisionAssignments.map((item) => (
                  <button
                    key={item.id}
                    ref={(el) => { revisionTabRefs.current[item.id] = el; }}
                    role="tab"
                    aria-selected={!showAllRevisionWeeks && item.id === activeAssignment?.id}
                    className={'week-tab' + (!showAllRevisionWeeks && item.id === activeAssignment?.id ? ' active' : '')}
                    onClick={() => { setSelectedWeekId(item.id); setShowAllRevisionWeeks(false); }}
                    title={item.name}
                  >
                    <span>{item.name}</span>
                  </button>
                ))}
              </div>
              <button type="button" className="week-scroll-arrow" aria-label="Scroll to later revision weeks"
                disabled={!revisionScrollState.right} onClick={() => scrollRevisionWeeks(1)}>
                <span aria-hidden="true" className="week-arrow-glyph">&gt;</span>
              </button>
            </div>
          </div>
        </div>
        <button type="button" className={'btn sm revision-all-weeks' + (showAllRevisionWeeks ? ' active' : '')}
          aria-pressed={showAllRevisionWeeks}
          onClick={() => setShowAllRevisionWeeks((value) => !value)}>
          <Icon name={showAllRevisionWeeks ? 'check' : 'layers'} size={13} />
          {showAllRevisionWeeks ? 'All weeks shown' : 'Show all weeks'}
        </button>
      </div>

      <div className="notes-controls revision-notes-controls">
        <div>
          <h3>{showAllRevisionWeeks ? 'All weeks · Revision notes' : (activeAssignment?.name || 'Revision notes')}</h3>
          <div className="notes-question-count" style={{ marginTop: 4 }}>
            {showAllRevisionWeeks
              ? `${visibleRevisionWeak.length} weak question${visibleRevisionWeak.length === 1 ? '' : 's'} across ${revisionAssignments.length} week${revisionAssignments.length === 1 ? '' : 's'}`
              : `${visibleRevisionWeak.length} weak question${visibleRevisionWeak.length === 1 ? '' : 's'} in this week`}
          </div>
        </div>
        <label className="row notes-explanation-toggle" style={{ gap: 8, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
          <Switch on={hideExplanations} onChange={setHideExplanations} />
          <span>{hideExplanations ? 'Explanations hidden' : 'Hide explanations'}</span>
        </label>
      </div>

      {visibleRevisionWeak.length === 0 ? (
        <div className="card empty revision-empty">
          <div className="empty-mark"><Icon name="book" size={21} /></div>
          <h3>No weak questions in {activeAssignment?.name || 'this week'}</h3>
          <p>Questions you repeatedly get wrong from this week will appear here as you practise.</p>
        </div>
      ) : visibleRevisionWeak.map(({ q, st }) => {
        const ans = answerIndices(q);
        return (
          <div className="card note" key={q.id} style={{ marginBottom: 12 }}>
            <div className="note-head">
              <span className="qnum">wrong {st.w}×</span>
              <span className="badge grey">{q._aname}</span>
              <span className="badge red" style={{ marginLeft: 'auto' }}>{pct(st.c, st.a)}%</span>
            </div>
            <div className="qtext" style={{ fontSize: 'var(--fs-sm)' }}><FormattedText text={q.question} /></div>
            {showAnswers ? (
              <>
                <ul className="opts">
                  {q.options.map((o, j) => (
                    <li key={j} className={ans.includes(j) ? 'ans' : ''}>
                      <span className="tag">{String.fromCharCode(65 + j)}</span>
                      <span style={{ flex: 1 }}><FormattedText text={typeof o === 'string' ? o : (o.text || o.label || '')} /></span>
                      {ans.includes(j) && <span className="tick">✓</span>}
                    </li>
                  ))}
                </ul>
                {!hideExplanations && q.explanation && <div className="explain"><b>Why:</b> <FormattedText text={q.explanation} /></div>}
              </>
            ) : (
              <button className="btn sm" onClick={() => setShowAnswers(true)}>
                <Icon name="eye" size={13} /> Reveal answers
              </button>
            )}
          </div>
        );
      })}

      {!showAllRevisionWeeks && <div className="row between notes-week-next-actions" style={{ marginTop: 20, gap: 10 }}>
        <button className="btn" disabled={activeIndex === 0} onClick={() => setSelectedWeekId(revisionAssignments[activeIndex - 1].id)}><Icon name="arrowL" size={13} /> Previous week</button>
        <button className="btn primary" disabled={activeIndex >= revisionAssignments.length - 1} onClick={() => setSelectedWeekId(revisionAssignments[activeIndex + 1].id)}>Next week <Icon name="arrowR" size={13} /></button>
      </div>}
      <AppFooter showReport={true} />
    </div>
  );
}

function NotesView({ subject, assignment, progress, onPractice }) {
  const assignments = subject?.assignments || [];
  const [selectedId, setSelectedId] = useState(assignment?.id || assignments[0]?.id || '');
  const [hideExplanations, setHideExplanations] = useState(false);
  const weekTabRefs = useRef({});
  const weekTabsContainerRef = useRef(null);
  const [weekScrollState, setWeekScrollState] = useState({ left: false, right: false });

  useEffect(() => {
    if (assignment?.id) setSelectedId(assignment.id);
    else if (!selectedId && assignments[0]) setSelectedId(assignments[0].id);
  }, [assignment?.id, subject?.id]);

  useEffect(() => {
    const container = weekTabsContainerRef.current;
    const activeTab = weekTabRefs.current[selectedId];
    if (!container || !activeTab) return;
    const containerRect = container.getBoundingClientRect();
    const tabRect = activeTab.getBoundingClientRect();
    let nextScrollLeft = container.scrollLeft;
    if (tabRect.left < containerRect.left + 2) {
      nextScrollLeft += tabRect.left - containerRect.left - 8;
    } else if (tabRect.right > containerRect.right - 2) {
      nextScrollLeft += tabRect.right - containerRect.right + 8;
    }
    if (Math.abs(nextScrollLeft - container.scrollLeft) > 1) {
      container.scrollTo({ left: Math.max(0, nextScrollLeft), behavior: 'smooth' });
    }
    const updateScrollState = () => {
      const next = {
        left: container.scrollLeft > 2,
        right: container.scrollLeft + container.clientWidth < container.scrollWidth - 2,
      };
      setWeekScrollState((current) => current.left === next.left && current.right === next.right ? current : next);
    };
    updateScrollState();
    container.addEventListener('scroll', updateScrollState, { passive: true });
    window.addEventListener('resize', updateScrollState);
    return () => {
      container.removeEventListener('scroll', updateScrollState);
      window.removeEventListener('resize', updateScrollState);
    };
  }, [selectedId, subject?.id, assignments.length]);

  const scrollNotesWeeks = (direction) => {
    const container = weekTabsContainerRef.current;
    if (!container) return;
    const tab = container.querySelector('.week-tab');
    const step = tab ? tab.getBoundingClientRect().width + 7 : Math.max(160, container.clientWidth * 0.7);
    container.scrollBy({ left: direction * step, behavior: 'smooth' });
  };

  if (!assignments.length) return <div className="page wrap"><h1>Notes</h1><div className="card empty"><h3>No notes available</h3><p>There are no weekly assignments available for this subject yet.</p></div></div>;

  const activeIndex = Math.max(0, assignments.findIndex((item) => item.id === selectedId));
  const active = assignments[activeIndex] || assignments[0];
  const selectAssignment = (item) => setSelectedId(item.id);

  return (
    <div className="page wrap">
      <div className="notes-page-heading">
        <div className="notes-page-heading-copy">
          <h1>Notes & answers</h1>
          <p className="muted" style={{ marginTop: 6 }}>{subject.title} · Browse questions and correct answers across all weeks.</p>
        </div>
        <button className="btn primary sm notes-practice-button" onClick={() => onPractice(active.id, active.questions.length)}><Icon name="play" size={12} /> Practise {active.name}</button>
      </div>

      <div className="notes-toolbar" aria-label="Week navigation">
        <div className="week-pager">
          <div className="week-tabs-shell" role="group" aria-label="Scrollable week selector">
            <button type="button" className="week-scroll-arrow" aria-label="Scroll to previous weeks"
              disabled={!weekScrollState.left} onClick={() => scrollNotesWeeks(-1)}>
              <span aria-hidden="true" className="week-arrow-glyph">&lt;</span>
            </button>
            <div ref={weekTabsContainerRef} className="week-tabs" role="tablist" aria-label="Choose week">
              {assignments.map((item) => (
                <button
                  key={item.id}
                  ref={(el) => { weekTabRefs.current[item.id] = el; }}
                  data-week-id={item.id}
                  role="tab"
                  aria-selected={item.id === active.id}
                  className={'week-tab' + (item.id === active.id ? ' active' : '')}
                  onClick={() => selectAssignment(item)}
                  title={item.name}
                >{item.name}</button>
              ))}
            </div>
            <button type="button" className="week-scroll-arrow" aria-label="Scroll to later weeks"
              disabled={!weekScrollState.right} onClick={() => scrollNotesWeeks(1)}>
              <span aria-hidden="true" className="week-arrow-glyph">&gt;</span>
            </button>
          </div>
        </div>
      </div>
      <div className="notes-controls">
        <div>
          <h2 style={{ fontSize: 'var(--fs-lg)' }}>{active.name}</h2>
          <div className="notes-question-count" style={{ marginTop: 4 }}>{active.questions.length} questions · Correct answers highlighted</div>
        </div>
        <label className="row notes-explanation-toggle" style={{ gap: 8, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
          <Switch on={hideExplanations} onChange={setHideExplanations} />
          <span>{hideExplanations ? 'Explanations hidden' : 'Hide explanations'}</span>
        </label>
      </div>

      {active.questions.map((q, i) => {
        const st = progress.questions[q.id];
        const ans = answerIndices(q);
        return (
          <div className="card note" key={q.id} style={{ marginBottom: 12 }}>
            <div className="note-head">
              <span className="qnum">Q{i + 1}</span>
              {st && st.w > 0 && <span className="badge red">wrong {st.w}×</span>}
              {st && st.c > 0 && <span className="badge green">right {st.c}×</span>}
              {!st && <span className="badge grey">new</span>}
            </div>
            <div className="qtext"><FormattedText text={q.question} /></div>
            <ul className="opts">
              {q.options.map((o, j) => (
                <li key={j} className={ans.includes(j) ? 'ans' : ''}>
                  <span className="tag">{String.fromCharCode(65 + j)}</span>
                  <span style={{ flex: 1 }}><FormattedText text={typeof o === 'string' ? o : (o.text || o.label || '')} /></span>
                  {ans.includes(j) && <span className="tick">✓</span>}
                </li>
              ))}
            </ul>
            {!hideExplanations && q.explanation && <div className="explain"><b>Why:</b> <FormattedText text={q.explanation} /></div>}
          </div>
        );
      })}
      <div className="row between notes-week-next-actions" style={{ marginTop: 20, gap: 10 }}>
        <button className="btn" disabled={activeIndex === 0} onClick={() => selectAssignment(assignments[activeIndex - 1])}><Icon name="arrowL" size={13} /> Previous week</button>
        <button className="btn primary" disabled={activeIndex >= assignments.length - 1} onClick={() => selectAssignment(assignments[activeIndex + 1])}>Next week <Icon name="arrowR" size={13} /></button>
      </div>
      <AppFooter showReport={true} />
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState(() => LS.get('nptel.theme', 'dark'));
  const [accent, setAccent] = useState(() => LS.get('nptel.accent', 'ocean'));
  const [settings, setSettings] = useState(() => ({
    instantFeedback: true, shuffleQuestions: true, shuffleOptions: true,
    ...LS.get('nptel.settings', {}),
  }));
  const [showSettings, setShowSettings] = useState(false);
  const [showSubjects, setShowSubjects] = useState(false);

  // ── First visit: show subject selection. Returning visits: reopen the last subject
  // only if the user explicitly selected one before. This avoids treating the default
  // first subject as a saved choice for brand-new visitors or legacy auto-saved data.
  const [subjectId, setSubjectId] = useState(() => {
    const hash = (typeof window !== 'undefined' && window.location.hash || '').replace('#', '');
    if (hash && SUBJECTS.some(s => s.id === hash)) return hash;
    const savedId = LS.get('nptel.currentSubject', null);
    // Backward compatibility: older versions only auto-saved the first subject by default.
    // A saved non-default subject is therefore likely to be a real previous selection.
    const hasExplicitSelection = LS.get('nptel.subjectSelected', false) || Boolean(savedId && savedId !== SUBJECTS[0].id);
    if (hasExplicitSelection && SUBJECTS.some(s => s.id === savedId)) return savedId;
    // Fallback subject if the user enters practice without choosing a subject.
    return 'psychology_of_learning';
  });
  const [subject, setSubject] = useState(null);
  const [progress, setProgress] = useState(null);
  const [achievements, setAchievements] = useState(() => {
    const saved = LS.get(ACHIEVEMENTS_KEY, null);
    const migrated = { ...emptyAchievements(), ...(saved || {}), activityDates: saved?.activityDates || [], history: saved?.history || [], totalAnswered: Number.isFinite(saved?.totalAnswered) ? saved.totalAnswered : (saved?.history || []).reduce((sum, run) => sum + answeredCountInRun(run), 0), masteredQuestionIdsBySubject: saved?.masteredQuestionIdsBySubject || {} };
    // Seed persistent mastery from retained history for existing users.
    (migrated.history || []).forEach((run) => {
      if (!run.subjectId) return;
      const subjectMastery = new Set(migrated.masteredQuestionIdsBySubject[run.subjectId] || []);
      (run.items || []).forEach((item) => { if (!item.skipped && item.correct && item.qid) subjectMastery.add(item.qid); });
      migrated.masteredQuestionIdsBySubject[run.subjectId] = [...subjectMastery];
    });
    return migrated;
  });
  const [banner, setBanner] = useState(null);
  const cacheRef = useRef({});

  const [screen, setScreen] = useState(() => {
    const hash = (typeof window !== 'undefined' && window.location.hash || '').replace('#', '');
    if (hash && SUBJECTS.some(s => s.id === hash)) return 'loading';
    const savedId = LS.get('nptel.currentSubject', null);
    const hasExplicitSelection = LS.get('nptel.subjectSelected', false) || Boolean(savedId && savedId !== SUBJECTS[0].id);
    return hasExplicitSelection && SUBJECTS.some(s => s.id === savedId) ? 'loading' : 'landing';
  });
  const screenRef = useRef(screen);
  screenRef.current = screen;
  const quizReturnScreenRef = useRef('home');
  const [quizConfig, setQuizConfig] = useState(null);
  const [result, setResult] = useState(null);
  const [notesAssignment, setNotesAssignment] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    LS.set('nptel.theme', theme);
  }, [theme]);

  useEffect(() => {
    document.documentElement.setAttribute('data-accent', accent);
    LS.set('nptel.accent', accent);
  }, [accent]);

  useEffect(() => { LS.set('nptel.settings', settings); }, [settings]);

  // Save the current course only after an actual selection or an explicit course deep-link.
  // Do not auto-save SUBJECTS[0] while a first-time visitor is still on the landing screen.
  useEffect(() => {
    if (subjectId && screen !== 'landing') {
      LS.set('nptel.currentSubject', subjectId);
      LS.set('nptel.subjectSelected', true);
    }
  }, [subjectId, screen]);

  // Keep the URL hash in sync so subjects are deep-linkable and shareable.
  useEffect(() => {
    const currentHash = window.location.hash.replace('#', '');
    if (screen === 'landing') {
      if (currentHash) history.replaceState(null, '', window.location.pathname + window.location.search);
    } else if (subjectId && currentHash !== subjectId) {
      history.replaceState(null, '', '#' + subjectId);
    }
  }, [subjectId, screen]);

  // Respond to manual hash edits and browser back/forward.
  useEffect(() => {
    const onHashChange = () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && SUBJECTS.some(s => s.id === hash) && hash !== subjectId) {
        setSubjectId(hash);
        setScreen('loading');
      } else if (!hash && screen !== 'landing' && screen !== 'quiz') {
        setScreen('landing');
      }
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, [subjectId, screen]);

  const subjectIndex = useMemo(
    () => SUBJECTS.map((s) => ({ id: s.id, name: s.name, file: s.file, image: s.image, institute: s.institute })),
    []
  );

  useEffect(() => {
    if (!subjectId || !subjectIndex.some((s) => s.id === subjectId)) {
      if (subjectIndex.length) setSubjectId(subjectIndex[0].id);
      return;
    }
    let cancelled = false;
    (async () => {
      setBanner(null);
      try {
        const meta = subjectIndex.find((s) => s.id === subjectId);
        let data;
        if (cacheRef.current[subjectId]) data = cacheRef.current[subjectId];
        else {
          try { data = await fetchJSON(QUESTIONS_FOLDER + meta.file); }
          catch (err) {
            data = DEMO_SUBJECT;
            setBanner('Could not load "' + meta.file + '" (' + err.message + '). Showing the built-in sample data.');
          }
        }
        const norm = normaliseSubject(data, meta);
        cacheRef.current[subjectId] = norm;
        if (cancelled) return;
        setSubject(norm);
        setProgress(loadProgress(subjectId));
        setScreen(prev => prev === 'loading' ? 'home' : prev);
      } catch (err) {
        if (cancelled) return;
        setBanner('Failed to load subject: ' + err.message);
        setScreen('landing');
      }
    })();
    return () => { cancelled = true; };
  }, [subjectId, subjectIndex]);

  useEffect(() => { if (subjectId && progress) LS.set(PROG_KEY(subjectId), progress); }, [subjectId, progress]);
  useEffect(() => { LS.set(ACHIEVEMENTS_KEY, achievements); }, [achievements]);

  const qmap = useMemo(() => {
    const m = {};
    if (subject) subject.assignments.forEach((a) => a.questions.forEach((q) => { m[q.id] = q; }));
    return m;
  }, [subject]);

  const prep = useCallback((list) => list.map((q) => prepareQuestion(q, settings.shuffleOptions)), [settings.shuffleOptions]);
  const orderPool = useCallback((pool) => {
    if (subjectId === 'joy_of_computing_using_python') return pool.slice();
    return settings.shuffleQuestions ? shuffle(pool) : pool.slice();
  }, [settings.shuffleQuestions, subjectId]);

  const startQuiz = (cfg) => {
    // Remember the actual source screen so Back returns to the workflow the learner came from.
    const originScreen = screenRef.current;
    if (originScreen !== 'quiz') quizReturnScreenRef.current = originScreen || 'home';
    // Captures all practice-start controls that use the shared startQuiz flow.
    trackGAEvent('practice_button_click', {
      ...getSubjectAnalyticsParams(subjectId),
      practice_mode: cfg.mode || 'unknown',
      planned_questions: cfg.questions.length,
      assignment_count: (cfg.assignmentIds || []).length,
    });
    if (!cfg.questions.length) { alert('No questions available for this selection.'); return; }
    trackGAEvent('quiz_start', {
      ...getSubjectAnalyticsParams(subjectId),
      practice_mode: cfg.mode || 'unknown',
      planned_questions: cfg.questions.length,
      assignment_count: (cfg.assignmentIds || []).length,
    });
    setQuizConfig({
      ...cfg,
      subjectId,
      shuffleQuestions: subjectId === 'joy_of_computing_using_python' ? false : settings.shuffleQuestions,
      shuffleOptions: settings.shuffleOptions,
    });
    setScreen('quiz');
  };

  const startRandom = useCallback((n) => {
    const pool = orderPool(allQuestions(subject));
    const picked = pool.slice(0, Math.min(n, pool.length));
    startQuiz({ mode: 'random', title: 'Random Practice · ' + picked.length + ' Q', questions: prep(picked), assignmentIds: [] });
  }, [subject, orderPool, prep]);

  const startCustom = useCallback((assignmentIds, n) => {
    const bank = allQuestions(subject).filter((q) => assignmentIds.includes(q._aid));
    const picked = orderPool(bank).slice(0, Math.min(n, bank.length));
    const label = assignmentIds.length === 1
      ? (subject.assignments.find((a) => a.id === assignmentIds[0]) || {}).name || 'Week'
      : assignmentIds.length + ' weeks';
    startQuiz({ mode: 'custom', title: label + ' · ' + picked.length + ' Q', questions: prep(picked), assignmentIds });
  }, [subject, orderPool, prep]);

  const startWeak = useCallback(() => {
    const list = weakQuestions(subject, progress).map((w) => w.q);
    startQuiz({ mode: 'weak', title: 'Weak Drill · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, progress, prep, orderPool]);

  const startBookmarks = useCallback(() => {
    const ids = progress.bookmarks || [];
    const list = allQuestions(subject).filter((q) => ids.includes(q.id));
    startQuiz({ mode: 'bookmarks', title: 'Bookmarked · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, progress, prep, orderPool]);

  const retryWrong = useCallback((qids) => {
    const list = allQuestions(subject).filter((q) => qids.includes(q.id));
    startQuiz({ mode: 'retry', title: 'Retry Wrong · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, prep, orderPool]);

  const handleFinish = useCallback((run) => {
    setProgress((prev) => {
      const p = prev ? JSON.parse(JSON.stringify(prev)) : emptyProgress();
      run.items.forEach((it) => {
        if (it.skipped) return;
        const st = p.questions[it.qid] || { a: 0, c: 0, w: 0, t: 0, last: 0, streak: 0 };
        st.a += 1; st.t += it.timeMs; st.last = run.ts;
        if (it.correct) { st.c += 1; st.streak = (st.streak || 0) + 1; }
        else { st.w += 1; st.streak = 0; }
        p.questions[it.qid] = st;
      });
      p.history = [{ ...run, subjectId: subject.id }, ...p.history].slice(0, 100);
      return p;
    });
    setAchievements((previous) => {
      const old = previous || emptyAchievements();
      const previousHistory = old.history || [];
      const isNewRun = !previousHistory.some((item) => item.id === run.id);
      const answeredThisRun = answeredCountInRun(run);
      const hasAnswered = answeredThisRun > 0;
      const activityDates = hasAnswered ? [...new Set([...(old.activityDates || []), localDateKey(run.ts)])].sort() : (old.activityDates || []);
      const record = { ...run, subjectId: subject.id, subjectTitle: subject.title };
      const history = [record, ...previousHistory.filter((item) => item.id !== run.id)].slice(0, 300);
      const totalAnswered = Math.max(0, Number(old.totalAnswered) || previousHistory.reduce((sum, item) => sum + answeredCountInRun(item), 0)) + (isNewRun ? answeredThisRun : 0);
      const masteredQuestionIdsBySubject = { ...(old.masteredQuestionIdsBySubject || {}) };
      const masteredForSubject = new Set(masteredQuestionIdsBySubject[subject.id] || []);
      // Every recorded correct, non-skipped answer permanently marks that question mastered.
      // Repeated attempts still count toward totalAnswered, but mastery stores unique question IDs.
      (run.items || []).forEach((item) => {
        if (!item.skipped && item.correct && item.qid) masteredForSubject.add(item.qid);
      });
      masteredQuestionIdsBySubject[subject.id] = [...masteredForSubject];
      return { activityDates, history, totalAnswered, masteredQuestionIdsBySubject };
    });
    setResult(run);
    setScreen('result');
  }, [subject]);

  const toggleBookmark = useCallback((qid) => {
    setProgress((prev) => {
      const p = prev ? { ...prev } : emptyProgress();
      const bm = p.bookmarks || [];
      p.bookmarks = bm.includes(qid) ? bm.filter((x) => x !== qid) : [...bm, qid];
      return p;
    });
  }, []);

  const changeSubject = (id) => {
    trackGAEvent('subject_selected', getSubjectAnalyticsParams(id));
    setSubjectId(id);
    LS.set('nptel.currentSubject', id);
    LS.set('nptel.subjectSelected', true);
    cacheRef.current = {};
    setSubject(null); setProgress(null);
    setShowSettings(false);
    setScreen('loading');
  };

  const exportProgress = () => {
    const data = {};
    Object.keys(localStorage).filter((k) => k.startsWith('nptel.')).forEach((k) => { data[k] = localStorage.getItem(k); });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mooc-mastery-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importProgress = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Object.keys(data).forEach((k) => { if (k.startsWith('nptel.')) localStorage.setItem(k, data[k]); });
        alert('Progress imported. Reloading…');
        location.reload();
      } catch (e) { alert('Invalid backup file.'); }
    };
    reader.readAsText(file);
  };

  const resetProgress = () => {
    if (!confirm('Reset all progress, history and bookmarks for "' + (subject ? subject.title : '') + '"?')) return;
    LS.del(PROG_KEY(subjectId));
    setProgress(emptyProgress());
    setShowSettings(false);
    setScreen('home');
  };

  const openStudy = (assignment) => {
    if (!assignment) return;
    setNotesAssignment(assignment);
    setScreen('notes');
  };

  const navigate = useCallback((target) => {
    if (target === 'notes') setNotesAssignment((current) => current || (subject && subject.assignments[0]) || null);
    setScreen(target);
  }, [subject]);

  if (screen === 'loading' || (screen !== 'landing' && !subject)) {
    return (
      <div className="center">
        <div style={{ textAlign: 'center' }}>
          <div className="spin" />
          <p className="muted" style={{ marginTop: 14 }}>Loading…</p>
        </div>
      </div>
    );
  }

  if (screen === 'quiz' && quizConfig) {
    return (
      <QuizRunner
        config={quizConfig} settings={settings}
        bookmarks={progress.bookmarks || []}
        onToggleBookmark={toggleBookmark}
        onFinish={handleFinish}
        onQuit={() => setScreen(quizReturnScreenRef.current || 'home')}
      />
    );
  }

  const navItems = [
    { id: 'landing',    label: 'Home',       icon: 'home' },
    { id: 'home',       label: 'Practice',   icon: 'practice' },
    { id: 'notes',      label: 'Notes',      icon: 'book' },
    { id: 'history',    label: 'History',    icon: 'history' },
    { id: 'cheatsheet', label: 'Cheatsheet', icon: 'notes' },
  ];
  const activeTab = screen;

  return (
    <div className="app">
      <div className="topbar">
        <div className="wrap">
          <div className="topbar-in">
            <button className="brand" onClick={() => navigate('landing')} aria-label="Go to home">
              <span className="brand-mark"><img src="/assets/mooc-mastery-icon.png" alt="" /></span>
              <span className="brand-text">
                <span className="brand-title">Mooc Mastery</span>
                <span className="brand-sub">
                  {screen === 'landing' || !subject ? 'NPTEL MCQ practice' : subject.title}
                </span>
              </span>
            </button>
            {subject && screen !== 'landing' && (
              <button className="switch-btn" onClick={() => setShowSubjects(true)}
                title="Switch subject" aria-haspopup="dialog">
                <Icon name="swap" size={14} />
                <span className="switch-btn-label">Switch</span>
              </button>
            )}
            <nav className="top-tabs" aria-label="Main">
              {navItems.map((t) => (
                <button key={t.id}
                  className={activeTab === t.id ? 'active' : ''}
                  title={t.label}
                  onClick={() => navigate(t.id)}
                  aria-current={activeTab === t.id ? 'page' : undefined}>
                  <span>{t.label}</span>
                </button>
              ))}
            </nav>
            <div className="top-actions">
              <button className="icon-btn" title="Toggle theme" aria-label="Toggle colour theme" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
              </button>
              <button className="icon-btn" title="Settings" aria-label="Open settings" onClick={() => setShowSettings(true)}>
                <Icon name="settings" size={16} />
              </button>
            </div>
          </div>
        </div>
      </div>

      {banner && screen !== 'landing' && (
        <div className="wrap" style={{ paddingTop: 12 }}><div className="banner">{banner}</div></div>
      )}

      <div style={{ flex: 1 }} className="app-main" key={screen}>
        {screen === 'landing' && (
          <LandingPage
            subjects={subjectIndex}
            banner={banner}
            onPick={changeSubject}
          />
        )}

        {screen === 'home' && subject && (
          <HomeView
            subject={subject} progress={progress} settings={settings} setSettings={setSettings}
            onStartRandom={startRandom} onStartCustom={startCustom}
            onStartWeak={startWeak} onStartBookmarks={startBookmarks}
            onStudy={openStudy} goHistory={() => setScreen('history')}
            onSwitchSubject={() => setShowSubjects(true)}
          />
        )}

        {screen === 'result' && result && (
          <ResultView
            result={result} qmap={qmap}
            onHome={() => setScreen(quizReturnScreenRef.current && quizReturnScreenRef.current !== 'result' ? quizReturnScreenRef.current : 'home')}
            onRetryWrong={retryWrong}
            onStudyAssignment={(aid) => openStudy(subject.assignments.find((a) => a.id === aid))}
          />
        )}

        {screen === 'history' && subject && (
          <HistoryView
            progress={progress} qmap={qmap} subject={subject} achievements={achievements}
            totalQuestions={subject.assignments.reduce((sum, item) => sum + item.questions.length, 0)}
            onStudyAssignment={(aid) => openStudy(subject.assignments.find((a) => a.id === aid))}
            onClear={() => { if (confirm('Clear all test history for this subject?')) setProgress({ ...progress, history: [] }); }}
          />
        )}

        {screen === 'cheatsheet' && subject && (
          <CheatsheetView
            subject={subject} progress={progress}
            onStudy={openStudy} onPracticeWeak={startWeak}
          />
        )}

        {screen === 'notes' && subject && (
          <NotesView
            subject={subject} assignment={(notesAssignment && subject.assignments.some((item) => item.id === notesAssignment.id)) ? notesAssignment : subject.assignments[0]} progress={progress}
            onPractice={(aid, n) => {
              const chosenAssignment = subject.assignments.find((item) => item.id === aid);
              if (chosenAssignment) setNotesAssignment(chosenAssignment);
              startCustom([aid], n);
            }}
          />
        )}
      </div>

      <nav className="bottom-nav" aria-label="Main">
        {navItems.map((t) => (
          <button key={t.id} data-tab={t.id}
            className={activeTab === t.id ? 'active' : ''}
            onClick={() => navigate(t.id)}
            aria-current={activeTab === t.id ? 'page' : undefined}>
            <Icon name={t.icon} size={20} strokeWidth={1.5} />
            <span>{t.label}</span>
          </button>
        ))}
      </nav>

      {showSettings && (
        <SettingsModal
          settings={settings} setSettings={setSettings}
          theme={theme} setTheme={setTheme}
          accent={accent} setAccent={setAccent}
          subject={subject} subjects={subjectIndex}
          onChangeSubject={changeSubject}
          onExport={exportProgress} onImport={importProgress}
          onResetProgress={resetProgress}
          onClose={() => setShowSettings(false)}
        />
      )}

      {showSubjects && (
        <SubjectSheet
          subjects={subjectIndex}
          currentId={subjectId}
          onPick={(id) => {
            setShowSubjects(false);
            if (id !== subjectId) changeSubject(id);
          }}
          onClose={() => setShowSubjects(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
/* Capture the browser's install prompt without replacing the app or service-worker code. */
let deferredInstallPrompt = null;
window.__moocInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  window.__moocInstallPrompt = event;
  window.dispatchEvent(new Event("pwa-install-available"));
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  window.__moocInstallPrompt = null;
  window.dispatchEvent(new Event("pwa-installed"));
});

window.installMoocMastery = async () => {
  if (!deferredInstallPrompt) return false;
  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  window.__moocInstallPrompt = null;
  promptEvent.prompt();
  const choice = await promptEvent.userChoice;
  if (choice.outcome !== "accepted") {
    // Browsers generally require a fresh beforeinstallprompt event before another attempt.
    return false;
  }
  return true;
};
</script>

</body>
</html>
