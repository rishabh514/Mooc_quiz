<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>Mooc Mastery — NPTEL MCQ Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;

  --fs-xs:12px; --fs-sm:13.5px; --fs-base:15px; --fs-md:16px;
  --fs-lg:18px; --fs-xl:22px; --fs-2xl:28px; --fs-3xl:36px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px; --s8:56px;

  --r-sm:6px; --r:10px; --r-lg:14px; --r-xl:18px;

  --wrap:840px; --gutter:18px;
  --top-h:56px; --nav-h:62px; --tap:44px;

  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);

  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:120ms; --base:180ms; --slow:260ms;
}

/* ---------- Neutrals · LIGHT ---------- */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3; --surface-3:#e2e6eb;
  --text:#0f1419; --text-2:#414953; --muted:#6b7481;
  --border:#e3e6eb; --border-2:#c9cfd7;

  --green:#1a7a4a; --green-bg:rgba(26,122,74,.10);
  --red:#b91c1c;   --red-bg:rgba(185,28,28,.09);
  --amber:#a16207; --amber-bg:rgba(161,98,7,.10);

  --shadow-xs:0 1px 2px rgba(15,20,25,.05);
  --shadow-sm:0 1px 3px rgba(15,20,25,.07),0 1px 2px rgba(15,20,25,.04);
  --shadow-md:0 4px 12px rgba(15,20,25,.09),0 2px 4px rgba(15,20,25,.04);
  --shadow-lg:0 20px 44px rgba(15,20,25,.20),0 6px 14px rgba(15,20,25,.08);
}

/* ---------- Neutrals · DARK ---------- */
[data-theme="dark"]{
  --bg:#0b0e12; --surface:#14181f; --surface-2:#1c212a; --surface-3:#252b36;
  --text:#eef0f3; --text-2:#adb6c2; --muted:#838d9b;
  --border:#232932; --border-2:#353d49;

  --green:#5fd39e; --green-bg:rgba(95,211,158,.12);
  --red:#f08a80;   --red-bg:rgba(240,138,128,.12);
  --amber:#e3b24a; --amber-bg:rgba(227,178,74,.12);

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.35);
  --shadow-lg:0 20px 44px rgba(0,0,0,.65),0 6px 14px rgba(0,0,0,.4);
}

/* ---------- Accent · OCEAN (default, blue) ---------- */
:root,[data-accent="ocean"]{
  --accent:#2563eb; --accent-solid:#2563eb;
  --accent-h:#1d4ed8; --accent-solid-h:#1d4ed8;
  --accent-on:#ffffff;
  --accent-soft:rgba(37,99,235,.08);
  --accent-line:rgba(37,99,235,.24);
  --accent-glow:rgba(37,99,235,.28);
}
[data-theme="dark"],[data-theme="dark"][data-accent="ocean"]{
  --accent:#8ab4f8; --accent-solid:#3b82f6;
  --accent-h:#a3c5fa; --accent-solid-h:#4d8ffa;
  --accent-on:#ffffff;
  --accent-soft:rgba(138,180,248,.13);
  --accent-line:rgba(138,180,248,.28);
  --accent-glow:rgba(59,130,246,.42);
}

/* ---------- Accent · AMBER ---------- */
[data-accent="amber"]{
  --accent:#b45309; --accent-solid:#b45309;
  --accent-h:#92400e; --accent-solid-h:#92400e;
  --accent-on:#ffffff;
  --accent-soft:rgba(180,83,9,.09);
  --accent-line:rgba(180,83,9,.26);
  --accent-glow:rgba(180,83,9,.30);
}
[data-theme="dark"][data-accent="amber"]{
  --accent:#fbbf24; --accent-solid:#d97706;
  --accent-h:#fcd34d; --accent-solid-h:#f59e0b;
  --accent-on:#ffffff;
  --accent-soft:rgba(251,191,36,.13);
  --accent-line:rgba(251,191,36,.30);
  --accent-glow:rgba(217,119,6,.42);
}

/* ---------- Accent · ROSE (crimson) ---------- */
[data-accent="rose"]{
  --accent:#be123c; --accent-solid:#be123c;
  --accent-h:#9f1239; --accent-solid-h:#9f1239;
  --accent-on:#ffffff;
  --accent-soft:rgba(190,18,60,.08);
  --accent-line:rgba(190,18,60,.24);
  --accent-glow:rgba(190,18,60,.28);
}
[data-theme="dark"][data-accent="rose"]{
  --accent:#fda4af; --accent-solid:#e11d48;
  --accent-h:#fecdd3; --accent-solid-h:#f43f5e;
  --accent-on:#ffffff;
  --accent-soft:rgba(253,164,175,.13);
  --accent-line:rgba(253,164,175,.28);
  --accent-glow:rgba(225,29,72,.42);
}

/* ============================================================
   RESET
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  font-size:var(--fs-base);
  line-height:1.55;
  font-weight:400;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background-color var(--base) var(--ease),color var(--base) var(--ease);
}
#root{position:relative;z-index:1}

h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.25}
h1{font-size:var(--fs-xl);letter-spacing:-.02em}
h2{font-size:var(--fs-lg);letter-spacing:-.015em}
h3{font-size:var(--fs-base);letter-spacing:-.01em}
p{margin:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-soft);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

.qtext,.qreview-question,.option .body,.opts li,.explain,.reveal-explain{
  overflow-wrap:break-word;word-wrap:break-word;word-break:break-word;
}

/* ============================================================
   MOTION
   ============================================================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes keyPop{0%{transform:scale(1)}55%{transform:scale(1.12)}100%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{
  width:100%;max-width:var(--wrap);margin:0 auto;
  padding-left:var(--gutter);padding-right:var(--gutter);
}
.page{padding-top:var(--s5);padding-bottom:var(--s6);animation:fadeUp var(--slow) var(--ease) both}
.app-main{flex:1;padding-bottom:calc(var(--nav-h) + var(--safe-b) + var(--s4))}

@media (min-width:768px){
  :root{--gutter:28px;--top-h:60px}
  .page{padding-top:var(--s6);padding-bottom:var(--s7)}
  .app-main{padding-bottom:var(--s7)}
  h1{font-size:var(--fs-2xl)}
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  padding-top:var(--safe-t);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  transition:background-color var(--base) var(--ease),border-color var(--base) var(--ease);
}
.topbar-in{display:flex;align-items:center;gap:var(--s2);height:var(--top-h)}

.brand{
  display:flex;align-items:center;gap:10px;min-width:0;flex:1;
  color:inherit;text-align:left;border-radius:var(--r);
  padding:2px;margin:-2px;
  transition:opacity var(--fast) var(--ease);
}
.brand:hover{opacity:.9}

.brand-mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;
  background:var(--accent-solid);
  color:var(--accent-on);
  display:grid;place-items:center;
  transition:transform var(--base) var(--ease),background var(--base) var(--ease);
}
.brand:hover .brand-mark{transform:rotate(-4deg) scale(1.03)}

.brand-text{min-width:0;display:block}
.brand-title{
  display:block;font-weight:600;font-size:var(--fs-sm);
  line-height:1.2;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-sub{
  display:block;font-size:var(--fs-xs);color:var(--muted);
  line-height:1.3;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.top-tabs{display:none;gap:2px;margin-left:var(--s4)}
.top-tabs button{
  font-size:var(--fs-sm);font-weight:500;color:var(--muted);
  padding:7px 12px;border-radius:var(--r);
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease);
  letter-spacing:-.005em;
}
.top-tabs button:hover{color:var(--text);background:var(--surface-2)}
.top-tabs button.active{color:var(--text);font-weight:600;background:var(--surface-2)}

.top-actions{display:flex;gap:4px}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r);
  border:1px solid transparent;background:transparent;color:var(--muted);
  display:grid;place-items:center;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease);
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}

@media (min-width:768px){.top-tabs{display:flex}}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-b);
  height:calc(var(--nav-h) + var(--safe-b));
  transition:background-color var(--base) var(--ease),border-color var(--base) var(--ease);
}
.bottom-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.01em;
  position:relative;transition:color var(--base) var(--ease);min-height:var(--tap);
}
.bottom-nav button::before{
  content:'';position:absolute;top:0;left:50%;
  width:26px;height:2px;border-radius:0 0 2px 2px;background:transparent;
  transform:translateX(-50%) scaleX(.3);transform-origin:center;
  transition:background var(--base) var(--ease),transform var(--base) var(--ease);
}
.bottom-nav button.active{color:var(--accent);font-weight:600}
.bottom-nav button.active::before{background:var(--accent);transform:translateX(-50%) scaleX(1)}
.bottom-nav svg{display:block;transition:transform var(--base) var(--ease)}
.bottom-nav button.active svg{transform:translateY(-1px)}
@media (min-width:768px){.bottom-nav{display:none}}

body.modal-open .bottom-nav{display:none !important}
body.modal-open{overflow:hidden}

/* ============================================================
   TYPOGRAPHY HELPERS
   ============================================================ */
.muted{color:var(--muted);font-size:var(--fs-sm)}
.tiny{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.lede{color:var(--text-2);font-size:var(--fs-md);line-height:1.6;max-width:60ch}

.section-title{
  display:flex;align-items:center;gap:10px;
  font-size:var(--fs-base);font-weight:600;color:var(--text);
  margin:var(--s7) 0 var(--s4);letter-spacing:-.01em;
}
.section-title::before{
  content:'';width:3px;height:15px;border-radius:2px;
  background:var(--accent);flex:0 0 auto;
  transition:background var(--base) var(--ease);
}
.section-title:first-child{margin-top:0}

.row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:var(--s3)}

/* ============================================================
   GRIDS
   ============================================================ */
.grid{display:grid;gap:var(--s3)}
.g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:768px){
  .grid{gap:var(--s4)}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s4);box-shadow:var(--shadow-xs);
  transition:background-color var(--base) var(--ease),border-color var(--base) var(--ease),box-shadow var(--base) var(--ease);
}
.card+.card{margin-top:var(--s3)}
@media (min-width:768px){.card{padding:var(--s5)}}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:0 var(--s4);height:var(--tap);border-radius:var(--r);
  font-size:var(--fs-sm);font-weight:500;letter-spacing:-.005em;cursor:pointer;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
             color var(--fast) var(--ease),opacity var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease),transform var(--fast) var(--ease);
  white-space:nowrap;position:relative;
}
.btn:hover:not(:disabled){border-color:var(--border-2);background:var(--surface-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}

.btn.primary{
  background:var(--accent-solid);border-color:var(--accent-solid);color:var(--accent-on);
  font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px var(--accent-glow);
}
.btn.primary:hover:not(:disabled){
  background:var(--accent-solid-h);border-color:var(--accent-solid-h);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 10px var(--accent-glow);
}
.btn.primary:active:not(:disabled){
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px var(--accent-glow);
}

.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text);border-color:transparent}
.btn.soft{background:var(--surface-2);border-color:transparent;color:var(--text-2)}
.btn.soft:hover:not(:disabled){background:var(--surface-3);color:var(--text);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--border)}
.btn.danger:hover:not(:disabled){background:var(--red-bg);border-color:var(--red)}
.btn.sm{height:36px;padding:0 var(--s3);font-size:var(--fs-xs);border-radius:var(--r-sm);gap:6px}
.btn.sm svg{width:13px;height:13px}
.btn.lg{height:48px;font-size:var(--fs-base);padding:0 var(--s5)}
.btn.block{width:100%}
.btn svg{flex:0 0 auto}

/* ============================================================
   BADGES
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:99px;font-size:var(--fs-xs);font-weight:500;
  letter-spacing:.005em;white-space:nowrap;line-height:1.6;
}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge.grey{background:var(--surface-2);color:var(--muted)}

/* ============================================================
   STATS
   ============================================================ */
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:var(--s3);min-width:0;box-shadow:var(--shadow-xs);
}
.stat .v{
  font-size:var(--fs-xl);font-weight:600;letter-spacing:-.025em;
  line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text);
}
.stat .v small{font-size:var(--fs-sm);color:var(--muted);font-weight:400;margin-left:1px}
.stat .l{font-size:var(--fs-xs);color:var(--muted);font-weight:400;margin-top:3px;line-height:1.4}
.g3 .stat .v{font-size:var(--fs-base)}
@media (min-width:768px){.g3 .stat .v{font-size:var(--fs-xl)}}

/* ============================================================
   FEATURE GRID — 3×2 desktop · 2×3 tablet · 1×6 mobile
   ============================================================ */
.features{
  display:grid;grid-template-columns:minmax(0,1fr);
  gap:var(--s4);
}
.feature{
  min-width:0;display:flex;flex-direction:column;gap:8px;
  padding:var(--s4);
  border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);
  transition:border-color var(--base) var(--ease),box-shadow var(--base) var(--ease),transform var(--base) var(--ease);
}
.feature:hover{
  border-color:var(--accent-line);
  box-shadow:var(--shadow-sm);
  transform:translateY(-2px);
}
.feature-icon{
  width:38px;height:38px;border-radius:11px;
  background:var(--accent-solid);color:var(--accent-on);
  display:grid;place-items:center;
  margin-bottom:var(--s2);
  box-shadow:0 2px 6px var(--accent-glow);
  transition:transform var(--base) var(--ease),box-shadow var(--base) var(--ease),background var(--base) var(--ease);
}
.feature:hover .feature-icon{
  transform:translateY(-2px) rotate(-5deg);
  box-shadow:0 6px 14px var(--accent-glow);
}
.feature-title{font-size:var(--fs-sm);font-weight:600;color:var(--text);line-height:1.35}
.feature-desc{font-size:var(--fs-xs);color:var(--muted);line-height:1.55}

@media (min-width:480px){
  .features{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
}
@media (min-width:820px){
  .features{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5)}
  .feature{padding:var(--s5)}
}

/* ============================================================
   STEPS — how it works
   ============================================================ */
.steps{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4)}
.step{min-width:0;display:flex;gap:var(--s3);align-items:flex-start}
.step-num{
  width:28px;height:28px;flex:0 0 auto;border-radius:50%;
  background:var(--accent-solid);color:var(--accent-on);
  display:grid;place-items:center;font-weight:600;font-size:var(--fs-xs);
  font-variant-numeric:tabular-nums;
  box-shadow:0 1px 3px var(--accent-glow);
  transition:transform var(--base) var(--ease),box-shadow var(--base) var(--ease);
}
.step:hover .step-num{transform:scale(1.08);box-shadow:0 4px 10px var(--accent-glow)}
.step-body{min-width:0}
.step-title{font-size:var(--fs-sm);font-weight:600;color:var(--text);line-height:1.3}
.step-desc{font-size:var(--fs-xs);color:var(--muted);line-height:1.55;margin-top:2px}

@media (min-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}}
@media (min-width:900px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ============================================================
   PAGE FOOTER
   ============================================================ */
.page-footer{
  margin-top:var(--s8);padding-top:var(--s5);
  border-top:1px solid var(--border);
  font-size:var(--fs-xs);color:var(--muted);line-height:1.65;max-width:62ch;
}

/* ============================================================
   LANDING HERO
   ============================================================ */
.hero{padding:var(--s5) 0 var(--s6);position:relative}

.hero-mark{
  width:48px;height:48px;border-radius:13px;
  background:var(--accent-solid);color:var(--accent-on);
  display:grid;place-items:center;margin-bottom:var(--s5);
  box-shadow:0 3px 10px var(--accent-glow);
  transition:transform var(--base) var(--ease),box-shadow var(--base) var(--ease);
  animation:heroIn .5s var(--ease) both;
}
.hero-mark:hover{transform:rotate(-6deg) scale(1.05);box-shadow:0 6px 16px var(--accent-glow)}

.hero h1{
  font-family:var(--font-serif);font-weight:600;
  font-size:var(--fs-2xl);letter-spacing:-.025em;line-height:1.15;
  margin-bottom:var(--s3);max-width:20ch;position:relative;display:inline-block;
  animation:heroIn .5s var(--ease) .05s both;
}
.hero h1::after{
  content:'';position:absolute;left:0;bottom:-10px;width:52px;height:3px;
  border-radius:2px;background:var(--accent);
  transform-origin:left;animation:barGrow .55s var(--ease) .35s both;
}
.hero .lede{
  margin-top:var(--s5);
  animation:heroIn .5s var(--ease) .1s both;
}

.hero-chips{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s5);
  animation:heroIn .5s var(--ease) .15s both;
}
.hero-chips span{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:99px;
  font-size:var(--fs-xs);font-weight:500;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease),
             background var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.hero-chips span svg{color:var(--accent)}
.hero-chips span:hover{
  border-color:var(--accent-line);color:var(--text);
  background:var(--accent-soft);transform:translateY(-1px);
}

/* Hero stat row — bright accent numbers */
.hero-stats{
  display:flex;gap:var(--s6);flex-wrap:wrap;
  margin-top:var(--s6);padding-top:var(--s5);
  border-top:1px solid var(--border);
  animation:heroIn .5s var(--ease) .2s both;
}
.hero-stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-stat strong{
  font-size:var(--fs-2xl);font-weight:600;line-height:1;
  color:var(--accent);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  font-family:var(--font-serif);
}
.hero-stat span{
  font-size:var(--fs-xs);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:500;
}

@media (min-width:768px){
  .hero{padding:var(--s6) 0 var(--s7)}
  .hero h1{font-size:var(--fs-3xl)}
}

/* ============================================================
   SUBJECT LIST
   ============================================================ */
.subject-list{display:flex;flex-direction:column;gap:var(--s2)}
.subject-card{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3);border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--text);
  transition:border-color var(--base) var(--ease),box-shadow var(--base) var(--ease),
             background var(--base) var(--ease),transform var(--base) var(--ease);
  min-height:var(--tap);box-shadow:var(--shadow-xs);
  position:relative;overflow:hidden;
}
.subject-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);
  transform:scaleY(0);transform-origin:center;
  transition:transform var(--base) var(--ease);
}
.subject-card:hover{
  border-color:var(--accent-line);
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
}
.subject-card:hover::before{transform:scaleY(1)}
.subject-card:active{transform:translateY(0)}
.subject-card .ico{
  width:44px;height:44px;border-radius:var(--r);flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:var(--font-serif);font-weight:600;font-size:20px;
  overflow:hidden;position:relative;border:1px solid var(--accent-line);
  transition:transform var(--base) var(--ease),background var(--base) var(--ease);
}
.subject-card:hover .ico{transform:rotate(-3deg);background:var(--accent-line)}
.subject-card .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.subject-card .ico .letter{position:absolute;inset:0;display:grid;place-items:center;line-height:1;padding-bottom:1px}
.subject-card .meta{flex:1;min-width:0}
.subject-card .meta .ttl{font-weight:600;font-size:var(--fs-base);line-height:1.3;letter-spacing:-.005em}
.subject-card .meta .sub{font-size:var(--fs-xs);color:var(--muted);margin-top:3px;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.subject-card .arrow{color:var(--muted);flex:0 0 auto;display:grid;place-items:center;transition:transform var(--base) var(--ease),color var(--base) var(--ease)}
.subject-card:hover .arrow{color:var(--accent);transform:translateX(3px)}
@media (min-width:768px){
  .subject-card{padding:var(--s4);gap:var(--s4)}
  .subject-card .ico{width:52px;height:52px;font-size:22px}
}

/* ============================================================
   PROMO STRIP
   ============================================================ */
.promo{
  margin-top:var(--s7);
  padding:var(--s5);
  border-radius:var(--r-lg);
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  display:flex;flex-direction:column;gap:var(--s3);
  position:relative;overflow:hidden;
}
.promo::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.promo h3{font-size:var(--fs-base);font-weight:600;color:var(--text)}
.promo p{font-size:var(--fs-sm);color:var(--text-2);line-height:1.55;max-width:52ch}
.promo .row{gap:6px}

/* ============================================================
   ABOUT BLOCK
   ============================================================ */
.about{margin-top:var(--s7)}
.about-lede{
  color:var(--text-2);font-size:var(--fs-sm);line-height:1.65;
  max-width:60ch;margin-bottom:var(--s5);
}
.about-points{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
.about-point{
  display:flex;gap:var(--s3);align-items:flex-start;
  padding-top:var(--s4);border-top:1px solid var(--border);
}
.about-num{
  font-family:var(--font-serif);font-size:var(--fs-base);font-weight:600;
  color:var(--accent);flex:0 0 auto;width:26px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.about-point h4{
  font-size:var(--fs-sm);font-weight:600;color:var(--text);
  margin-bottom:4px;letter-spacing:-.005em;
}
.about-point p{
  font-size:var(--fs-xs);color:var(--muted);line-height:1.55;max-width:52ch;
}
@media (min-width:640px){
  .about-points{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5)}
  .about-point{flex-direction:column;gap:var(--s2);padding-top:var(--s5)}
}

/* ============================================================
   BANNER
   ============================================================ */
.banner{
  padding:var(--s3) var(--s4);border-radius:var(--r);
  background:var(--amber-bg);color:var(--amber);
  font-size:var(--fs-sm);line-height:1.5;
  border:1px solid rgba(161,98,7,.18);margin-bottom:var(--s4);
  animation:fadeUp var(--slow) var(--ease) both;
}

/* ============================================================
   CHECKBOX ROWS
   ============================================================ */
.chk{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface);cursor:pointer;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease);
  min-height:var(--tap);
}
.chk:hover{border-color:var(--border-2)}
.chk:active{transform:scale(.995)}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .box{
  width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-2);
  display:grid;place-items:center;font-size:11px;color:transparent;flex:0 0 auto;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
             color var(--fast) var(--ease),transform var(--base) var(--ease);
  line-height:1;
}
.chk.on .box{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--accent-on);transform:scale(1.08)}

/* ============================================================
   STEPPER
   ============================================================ */
.stepper{
  display:inline-flex;align-items:center;
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:var(--surface);height:var(--tap);
}
.stepper button{
  width:var(--tap);height:100%;color:var(--text-2);font-size:var(--fs-lg);
  font-weight:400;line-height:1;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease);
}
.stepper button:hover{background:var(--surface-2);color:var(--text)}
.stepper button:active{background:var(--accent-soft);color:var(--accent)}
.stepper input{
  width:56px;height:100%;border:0;
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  background:transparent;text-align:center;font-size:var(--fs-sm);font-weight:600;
  color:var(--text);outline:none;font-variant-numeric:tabular-nums;
  transition:background var(--fast) var(--ease);-moz-appearance:textfield;
}
.stepper input:focus{background:var(--surface-2)}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ============================================================
   QUIZ OPTIONS
   ============================================================ */
.option{
  display:flex;gap:var(--s3);align-items:flex-start;width:100%;text-align:left;
  padding:var(--s3) var(--s4);border:1.5px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;font-size:var(--fs-base);line-height:1.5;
  color:var(--text);margin-bottom:var(--s2);min-height:var(--tap);
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),
             box-shadow var(--base) var(--ease),transform var(--fast) var(--ease);
}
.option:last-child{margin-bottom:0}
.option:hover:not(:disabled):not(.locked){border-color:var(--border-2);background:var(--surface-2)}
.option:active:not(:disabled):not(.locked){transform:scale(.995)}
.option:disabled{cursor:default}
.option .key{
  flex:0 0 auto;width:26px;height:26px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:var(--fs-xs);font-weight:600;color:var(--muted);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             border-color var(--fast) var(--ease);
  font-variant-numeric:tabular-nums;
}
.option .body{flex:1;padding-top:2px}
.option.selected{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.option.selected .key{
  background:var(--accent-solid);color:var(--accent-on);border-color:var(--accent-solid);
  animation:keyPop var(--base) var(--ease) both;
}
.option.correct{
  border-color:var(--green);background:var(--green-bg);
  box-shadow:0 0 0 3px var(--green-bg);animation:pop var(--slow) var(--ease);
}
.option.correct .key{background:var(--green);color:#fff;border-color:var(--green)}
.option.wrong{
  border-color:var(--red);background:var(--red-bg);
  box-shadow:0 0 0 3px var(--red-bg);animation:shake var(--slow) var(--ease);
}
.option.wrong .key{background:var(--red);color:#fff;border-color:var(--red)}
.option .mark{flex:0 0 auto;margin-top:3px;animation:pop var(--slow) var(--ease)}

.flash{position:fixed;inset:0;pointer-events:none;z-index:90;animation:fadeOut .5s var(--ease) forwards}
.flash.correct{background:radial-gradient(circle at 50% 45%,rgba(26,122,74,.22),transparent 62%)}
.flash.wrong{background:radial-gradient(circle at 50% 45%,rgba(185,28,28,.22),transparent 62%)}

.reveal-card{
  margin-top:var(--s4);border-radius:var(--r);padding:var(--s3) var(--s4);
  border:1px solid var(--border);background:var(--surface-2);
  animation:fadeUp var(--base) var(--ease) both;
}
.reveal-card.ok{border-color:var(--green);background:var(--green-bg)}
.reveal-card.bad{border-color:var(--red);background:var(--red-bg)}
.reveal-head{
  display:flex;align-items:center;gap:var(--s2);
  font-weight:600;font-size:var(--fs-sm);margin-bottom:var(--s2);letter-spacing:-.005em;
}
.reveal-card.ok .reveal-head{color:var(--green)}
.reveal-card.bad .reveal-head{color:var(--red)}
.reveal-answer{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:var(--r-sm);
  font-size:var(--fs-xs);font-weight:500;
  background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s3);
}
.reveal-answer b{color:var(--green);font-weight:600;margin-left:2px}
.reveal-explain{
  font-size:var(--fs-sm);line-height:1.6;color:var(--text-2);
  padding-top:var(--s2);border-top:1px solid var(--border);margin-top:var(--s2);
}
.reveal-explain b{font-weight:600;color:var(--text)}

/* ============================================================
   QUIZ ACTIONS
   ============================================================ */
.quiz-actions{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.quiz-actions-meta{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.quiz-actions-row{display:grid;grid-template-columns:1fr 1.6fr;gap:var(--s2)}
.quiz-actions-row .btn{width:100%;height:48px;font-size:var(--fs-base)}

/* ============================================================
   PROGRESS BAR
   ============================================================ */
.pbar{height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar>i{
  display:block;height:100%;background:var(--accent-solid);
  transition:width .3s var(--ease),background var(--base) var(--ease);border-radius:99px;
}

/* ============================================================
   PORTAL + MODAL
   ============================================================ */
.portal-root{position:relative;z-index:9999}
.overlay{
  position:fixed;inset:0;background:rgba(10,13,17,.55);
  display:flex;align-items:flex-end;justify-content:center;
  animation:overlayIn var(--base) var(--ease) both;
}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.65)}
@media (min-width:640px){.overlay{align-items:center;padding:var(--s5)}}

.modal{
  background:var(--surface);border:1px solid var(--border);
  width:100%;max-width:720px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-lg);
  height:100dvh;max-height:100dvh;border-radius:0;
  animation:sheetIn var(--slow) var(--ease) both;
}
@media (min-width:640px){
  .modal{border-radius:var(--r-xl);height:auto;max-height:min(88dvh,900px);animation:modalIn var(--slow) var(--ease) both}
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) var(--s4);padding-top:calc(var(--s3) + var(--safe-t));
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
@media (min-width:640px){.modal-head{padding:var(--s4) var(--s5)}}
.modal-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:var(--s4);padding-bottom:calc(var(--s6) + var(--safe-b));
}
@media (min-width:640px){.modal-body{padding:var(--s5)}}
.sheet-handle{
  width:36px;height:4px;border-radius:99px;background:var(--border-2);
  margin:var(--s2) auto 0;flex:0 0 auto;
}
@media (min-width:640px){.sheet-handle{display:none}}

/* ============================================================
   THEME PICKER
   ============================================================ */
.theme-picker{
  display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s2);
}
.theme-swatch{
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s2);
  border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);
  cursor:pointer;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.theme-swatch:hover{border-color:var(--border-2);background:var(--surface-2)}
.theme-swatch:active{transform:scale(.97)}
.theme-swatch.selected{border-color:var(--accent);background:var(--accent-soft)}
.swatch-circle{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  transition:transform var(--base) var(--ease),box-shadow var(--base) var(--ease);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.theme-swatch.selected .swatch-circle{
  transform:scale(1.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 3px var(--accent-soft);
}
.swatch-label{font-size:var(--fs-xs);font-weight:500;color:var(--text-2);letter-spacing:.005em}
.theme-swatch.selected .swatch-label{color:var(--accent);font-weight:600}

/* ============================================================
   PACE JOURNEY
   ============================================================ */
.journey{
  display:flex;align-items:flex-end;gap:3px;height:96px;padding:var(--s2);
  background:var(--surface-2);border-radius:var(--r);overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.journey .bar{
  flex:1;min-width:6px;border-radius:3px 3px 0 0;
  transition:height var(--base) var(--ease),opacity var(--fast) var(--ease);
  cursor:help;animation:fadeUp var(--base) var(--ease) both;
}
.journey .bar:hover{opacity:.75}
.journey .bar.ok{background:var(--green)}
.journey .bar.bad{background:var(--red)}
.journey .bar.skipped{background:var(--border-2)}

/* ============================================================
   HISTORY
   ============================================================ */
.hrow{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);margin-bottom:var(--s2);
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
  box-shadow:var(--shadow-xs);
}
.hrow:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.score-pill{
  width:52px;height:52px;flex:0 0 auto;border-radius:var(--r);
  display:grid;place-items:center;font-weight:600;font-size:var(--fs-base);
  line-height:1;font-variant-numeric:tabular-nums;
  border:1px solid transparent;letter-spacing:-.02em;
}
.score-pill small{font-size:11px;opacity:.7;margin-left:1px;font-weight:400}
.score-pill.good{background:var(--green-bg);color:var(--green);border-color:rgba(26,122,74,.22)}
.score-pill.mid{background:var(--amber-bg);color:var(--amber);border-color:rgba(161,98,7,.22)}
.score-pill.bad{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,.22)}

/* ============================================================
   QUESTION REVIEW
   ============================================================ */
.qreview-list{display:flex;flex-direction:column;gap:var(--s2)}
.qreview{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-xs);
  transition:border-color var(--fast) var(--ease);
}
.qreview:hover{border-color:var(--border-2)}
.qreview-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.qreview-question{font-size:var(--fs-sm);font-weight:500;line-height:1.55;margin-bottom:var(--s2);color:var(--text)}
.qreview-answers{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs);color:var(--text-2);line-height:1.5}
.qreview-answers .ok{color:var(--green);font-weight:600}
.qreview-answers .bad{color:var(--red);font-weight:600}

/* ============================================================
   NOTES
   ============================================================ */
.note{border-left:2px solid var(--accent);padding-left:var(--s4)}
.note-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.qnum{
  min-width:26px;height:22px;padding:0 6px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--border);
  display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);
}
.qtext{font-size:var(--fs-base);font-weight:500;line-height:1.55;margin-bottom:var(--s3)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.opts li{
  display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--fs-sm);
  padding:var(--s2) var(--s3);border-radius:var(--r-sm);background:var(--surface-2);

function shuffle(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [x[i], x[j]] = [x[j], x[i]]; }
  return x;
}
function fmtClock(ms) {
  ms = Math.max(0, ms | 0);
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function answerIndices(q) {
  if (!q) return [];
  let a = q.answer;
  if (a === undefined || a === null) a = q.correct;
  if (a === undefined || a === null) a = q.correctAnswer;
  if (a === undefined || a === null) return [];
  const toIdx = (x) => {
    if (typeof x === 'number' && Number.isFinite(x)) return x | 0;
    if (typeof x === 'string') {
      const s = x.trim();
      if (/^\d+$/.test(s)) return parseInt(s, 10);
      if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
    }
    return -1;
  };
  let arr;
  if (Array.isArray(a)) arr = a;
  else if (typeof a === 'string' && a.includes(',')) arr = a.split(',');
  else arr = [a];
  return arr.map(toIdx).filter((n) => n >= 0);
}

function sameSet(a, b) {
  if (a.length !== b.length) return false;
  const s = new Set(b);
  return a.every((x) => s.has(x));
}

function prepareQuestion(q, shuffleOpts) {
  if (!shuffleOpts || !q.options || q.options.length < 2) return q;
  const order = shuffle(q.options.map((_, i) => i));
  const map = {};
  order.forEach((oldI, newI) => { map[oldI] = newI; });
  return { ...q, options: order.map((i) => q.options[i]), answer: answerIndices(q).map((oi) => map[oi]) };
}

/* =========================================================================
   NORMALISE
   ========================================================================= */
function normaliseSubject(raw, meta) {
  const id = meta.id;
  const title = meta.name || raw.course || 'Untitled subject';
  const institute = raw.institute || meta.institute || '';
  const term = raw.assignment || meta.term || '';

  const rawQs = raw.questions || raw.qs || [];
  const byWeek = {};
  rawQs.forEach((q, i) => {
    const week = q.week || 1;
    if (!byWeek[week]) byWeek[week] = [];

    const options = (q.options || []).map((o) =>
      typeof o === 'string' ? o
      : (o && (o.text ?? o.value ?? o.label)) ?? String(o)
    );

    const answer =
      q.correctAnswer !== undefined ? q.correctAnswer :
      q.answer !== undefined ? q.answer :
      q.correct !== undefined ? q.correct : null;

    byWeek[week].push({
      id: q.id || (q.questionNo ? `W${week}-Q${q.questionNo}` : `W${week}-${i}`),
      question: q.question || q.text || '',
      options, answer,
      explanation: q.explanation || q.solution || '',
      _aid: 'W' + week, _aname: 'Week ' + week,
      _week: week, _qno: q.questionNo, _type: q.type || 'MCQ',
    });
  });

  const assignments = Object.keys(byWeek)
    .map((w) => parseInt(w, 10))
    .sort((a, b) => a - b)
    .map((w) => ({ id: 'W' + w, name: 'Week ' + w, questions: byWeek[w] }));

  return { id, title, institute, term, assignments };
}

const PROG_KEY = (sid) => 'nptel.progress.' + sid;
const emptyProgress = () => ({ questions: {}, history: [], bookmarks: [] });
const loadProgress = (sid) => {
  const p = LS.get(PROG_KEY(sid), null);
  if (!p) return emptyProgress();
  return { questions: p.questions || {}, history: p.history || [], bookmarks: p.bookmarks || [] };
};

function allQuestions(subject) {
  const out = [];
  subject.assignments.forEach((a) => a.questions.forEach((q) => out.push(q)));
  return out;
}

function weakQuestions(subject, progress) {
  const out = [];
  subject.assignments.forEach((a) => a.questions.forEach((q) => {
    const st = progress.questions[q.id];
    if (!st || !st.a) return;
    const acc = st.c / st.a;
    if (st.w >= 2 && acc < 0.6) out.push({ q, st, weight: st.w - st.c });
  }));
  return out.sort((x, y) => y.weight - x.weight || y.st.w - x.st.w);
}

function paceProfile(items) {
  const answered = items.filter((i) => !i.skipped);
  const avg = answered.length ? answered.reduce((s, i) => s + i.timeMs, 0) / answered.length : 0;
  const thresh = avg || 1;
  const counts = { perfect: 0, deliberate: 0, hasty: 0, stuck: 0 };
  answered.forEach((i) => {
    const fast = i.timeMs <= thresh;
    const k = i.correct ? (fast ? 'perfect' : 'deliberate') : (fast ? 'hasty' : 'stuck');
    counts[k]++;
  });
  return { counts, avg, thresh };
}

function Switch({ on, onChange }) {
  return <button className={'switch' + (on ? ' on' : '')} onClick={() => onChange(!on)} aria-pressed={on} aria-label="Toggle"><i /></button>;
}

function Stepper({ value, onChange, min = 1, max = 999, step = 5 }) {
  const clamp = (v) => Math.min(max, Math.max(min, v));
  return (
    <div className="stepper">
      <button type="button" onClick={() => onChange(clamp(value - step))} aria-label="Decrease">−</button>
      <input type="number" value={value} onChange={(e) => { const v = parseInt(e.target.value, 10); onChange(clamp(isNaN(v) ? min : v)); }} />
      <button type="button" onClick={() => onChange(clamp(value + step))} aria-label="Increase">+</button>
    </div>
  );
}

function ThemePicker({ accent, onChange }) {
  return (
    <div className="theme-picker" role="radiogroup" aria-label="Accent colour">
      {ACCENTS.map((t) => {
        const selected = accent === t.id;
        return (
          <button
            key={t.id}
            type="button"
            role="radio"
            aria-checked={selected}
            className={'theme-swatch' + (selected ? ' selected' : '')}
            onClick={() => onChange(t.id)}
          >
            <span className="swatch-circle" style={{ background: t.color }}>
              {selected && <Icon name="check" size={13} strokeWidth={2.4} />}
            </span>
            <span className="swatch-label">{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function PaceProfile({ items }) {
  const { counts, avg, thresh } = paceProfile(items);
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return (
    <div>
      <div className="row between" style={{ marginBottom: 12 }}>
        <h3>Response-time profile</h3>
        <span className="tiny">avg {fmtClock(avg)} · split {fmtClock(thresh)}</span>
      </div>
      <div className="grid g4">
        {Object.keys(PACE_META).map((k) => {
          const m = PACE_META[k];
          return (
            <div className="stat" key={k}>
              <div className="row between" style={{ marginBottom: 6 }}>
                <span style={{ color: 'var(--' + m.cls + ')' }}><Icon name={m.icon} size={15} /></span>
                <span className={'badge ' + m.cls}>{pct(counts[k], total)}%</span>
              </div>
              <div className="v">{counts[k]}</div>
              <div className="l">{m.label}</div>
              <div className="tiny" style={{ marginTop: 2 }}>{m.desc}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PaceJourney({ items }) {
  const max = Math.max(1, ...items.map((i) => i.timeMs));
  return (
    <div>
      <div className="row between" style={{ marginBottom: 8 }}>
        <h3>Pace journey</h3>
        <span className="tiny">bar height = time taken</span>
      </div>
      <div className="journey">
        {items.map((it, i) => (
          <div key={i}
            className={'bar ' + (it.skipped ? 'skipped' : it.correct ? 'ok' : 'bad')}
            style={{ height: Math.max(8, (it.timeMs / max) * 100) + '%', animationDelay: (i * 18) + 'ms' }}
            title={'Q' + (i + 1) + ' · ' + (it.timeMs / 1000).toFixed(1) + 's · ' + (it.skipped ? 'skipped' : it.correct ? 'correct' : 'wrong')}
          />
        ))}
      </div>
      <div className="row" style={{ marginTop: 10, gap: 14 }}>
        <span className="tiny">Correct</span>
        <span className="tiny" style={{ color: 'var(--red)' }}>Wrong</span>
        <span className="tiny">Skipped</span>
      </div>
    </div>
  );
}

/* =========================================================================
   QUIZ
   ========================================================================= */
function QuizRunner({ config, settings, bookmarks, onToggleBookmark, onFinish, onQuit }) {
  const questions = config.questions;
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState([]);
  const [locked, setLocked] = useState(false);
  const [records, setRecords] = useState([]);
  const [elapsed, setElapsed] = useState(0);
  const [flash, setFlash] = useState(null);

  const qStart = useRef(Date.now());
  const t0 = useRef(Date.now());
  const flashTimer = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setElapsed(Date.now() - t0.current), 250);
    return () => clearInterval(t);
  }, []);
  useEffect(() => () => clearTimeout(flashTimer.current), []);
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [idx]);

  const q = questions[idx];
  const correctIdx = useMemo(() => (q ? answerIndices(q) : []), [q]);
  const multi = correctIdx.length > 1;
  const isLast = idx === questions.length - 1;
  const reveal = settings.instantFeedback && locked;
  const isCorrect = reveal && sameSet(selected, correctIdx);
  const correctCount = records.filter((r) => r.correct).length;

  const finish = useCallback((recs) => {
    const list = recs || records;
    const answered = list.filter((r) => !r.skipped);
    const score = answered.filter((r) => r.correct).length;
    onFinish({
      id: uid(), ts: Date.now(),
      mode: config.mode, modeLabel: config.title,
      assignmentIds: config.assignmentIds || [],
      score, total: answered.length,
      skipped: list.length - answered.length,
      timeTotal: list.reduce((s, r) => s + r.timeMs, 0),
      items: list,
    });
  }, [records, onFinish, config]);

  const submit = useCallback((sel) => {
    if (locked || !q) return;
    const timeMs = Date.now() - qStart.current;
    const correct = sameSet(sel, correctIdx);
    setSelected(sel);
    setLocked(true);
    setRecords((r) => [...r, {
      qid: q.id, correct, timeMs, skipped: false,
      sel: sel.map((i) => q.options[i]),
      ans: correctIdx.map((i) => q.options[i]),
      aid: q._aid, aname: q._aname,
    }]);
    if (settings.instantFeedback) {
      setFlash(correct ? 'correct' : 'wrong');
      vibrate(correct ? 25 : [15, 40, 15]);
      clearTimeout(flashTimer.current);
      flashTimer.current = setTimeout(() => setFlash(null), 480);
    } else vibrate(correct ? 20 : 35);
  }, [locked, q, correctIdx, settings.instantFeedback]);

  const advance = useCallback(() => {
    if (isLast) { finish(); return; }
    setIdx((i) => i + 1); setSelected([]); setLocked(false); qStart.current = Date.now();
  }, [isLast, finish]);

  const skip = useCallback(() => {
    if (!q) return;
    const rec = {
      qid: q.id, correct: false, timeMs: Date.now() - qStart.current, skipped: true,
      sel: [], ans: correctIdx.map((i) => q.options[i]), aid: q._aid, aname: q._aname,
    };
    const recs = [...records, rec];
    setRecords(recs);
    if (isLast) finish(recs);
    else { setIdx((i) => i + 1); setSelected([]); setLocked(false); qStart.current = Date.now(); }
  }, [q, records, isLast, finish, correctIdx]);

  const choose = useCallback((i) => {
    if (locked) return;
    if (multi) { setSelected((s) => (s.includes(i) ? s.filter((x) => x !== i) : [...s, i])); return; }
    if (settings.instantFeedback) submit([i]);
    else setSelected([i]);
  }, [locked, multi, settings.instantFeedback, submit]);

  const needsSubmit = multi || !settings.instantFeedback;
  let primaryLabel, primaryAction, primaryDisabled;
  if (locked) { primaryLabel = isLast ? 'Finish' : 'Next'; primaryAction = advance; primaryDisabled = false; }
  else if (needsSubmit) { primaryLabel = 'Check answer'; primaryAction = () => submit(selected); primaryDisabled = selected.length === 0; }
  else { primaryLabel = 'Select an option'; primaryAction = () => {}; primaryDisabled = true; }

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT') return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && q && n <= q.options.length) { choose(n - 1); return; }
      if (e.key === 'Enter') { e.preventDefault(); if (!primaryDisabled) primaryAction(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [choose, primaryAction, primaryDisabled, q]);

  if (!q) return null;
  const isBookmarked = bookmarks.includes(q.id);
  const progressPct = ((idx + (locked ? 1 : 0)) / questions.length) * 100;

  return (
    <div className="app">
      {flash && <div className={'flash ' + flash} />}

      <div className="topbar">
        <div className="wrap">
          <div className="topbar-in">
            <button className="icon-btn" onClick={onQuit} aria-label="Quit"><Icon name="x" size={17} /></button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 'var(--fs-sm)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{config.title}</div>
              <div className="tiny">Question {idx + 1} of {questions.length}</div>
            </div>
            <span className="badge grey" style={{ fontVariantNumeric: 'tabular-nums' }}><Icon name="clock" size={11} />{fmtClock(elapsed)}</span>
            <button className="icon-btn" onClick={() => onToggleBookmark(q.id)} aria-label="Bookmark"
              style={isBookmarked ? { color: 'var(--accent)', background: 'var(--accent-soft)', borderColor: 'var(--accent-line)' } : undefined}>
              <Icon name={isBookmarked ? 'bookmarkF' : 'bookmark'} size={16} />
            </button>
          </div>
          <div className="pbar" style={{ marginBottom: 10 }}>
            <i style={{ width: progressPct + '%' }} />
          </div>
        </div>
      </div>

      <div className="wrap" style={{ flex: 1 }}>
        <div className="page" style={{ paddingBottom: 'calc(96px + var(--safe-b))' }}>
          <div className="row between" style={{ marginBottom: 10 }}>
            <span className="badge blue">{q._aname}</span>
            {multi && <span className="badge amber">Select {correctIdx.length}</span>}
            <span className="tiny" style={{ marginLeft: 'auto' }}>{correctCount} correct so far</span>
          </div>

          <div className="card">
            <div className="qtext" style={{ fontSize: 16 }}>{q.question}</div>
            <div style={{ marginTop: 14 }}>
              {q.options.map((opt, i) => {
                const isSel = selected.includes(i);
                const isCorr = correctIdx.includes(i);
                let cls = 'option';
                if (isSel) cls += ' selected';
                if (reveal && isCorr) cls += ' correct';
                if (reveal && isSel && !isCorr) cls += ' wrong';
                if (locked) cls += ' locked';
                return (
                  <button key={i} className={cls} onClick={() => choose(i)} disabled={locked}>
                    <span className="key">{String.fromCharCode(65 + i)}</span>
                    <span className="body">{opt}</span>
                    {reveal && isCorr && <span className="mark" style={{ color: 'var(--green)' }}><Icon name="check" size={16} /></span>}
                    {reveal && isSel && !isCorr && <span className="mark" style={{ color: 'var(--red)' }}><Icon name="x" size={16} /></span>}
                  </button>
                );
              })}
            </div>
            {reveal && (
              <div className={'reveal-card ' + (isCorrect ? 'ok' : 'bad')}>
                <div className="reveal-head">
                  {isCorrect ? <><Icon name="check" size={15} /> Correct</> : <><Icon name="x" size={15} /> Incorrect</>}
                </div>
                <div className="reveal-answer">Correct answer: <b>{correctIdx.map(i => String.fromCharCode(65 + i)).join(', ')}</b></div>
                {q.explanation && <div className="reveal-explain"><b>Why:</b> {q.explanation}</div>}
              </div>
            )}
          </div>

          <div className="quiz-actions">
            <div className="quiz-actions-meta">
              <span className="tiny">Question {idx + 1}</span>
              <span className="tiny">{questions.length - idx - 1} remaining</span>
            </div>
            <div className="quiz-actions-row">
              <button className="btn" onClick={skip} disabled={locked}>
                <Icon name="skip" size={13} /> Skip
              </button>
              <button className={'btn ' + (locked || needsSubmit ? 'primary' : 'soft')} onClick={primaryAction} disabled={primaryDisabled}>
                {primaryLabel}
                {locked && !isLast && <Icon name="arrowR" size={15} />}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

   RESULT
   ========================================================================= */
function ResultView({ result, qmap, onHome, onRetryWrong, onStudyAssignment }) {
  const accuracy = pct(result.score, result.total);
  const wrongItems = result.items.filter((i) => !i.correct && !i.skipped);
  const [openItem, setOpenItem] = useState(null);

  const verdict = accuracy === 100 ? { t: 'Perfect score', c: 'green' }
    : accuracy >= 80 ? { t: 'Strong result', c: 'green' }
    : accuracy >= 50 ? { t: 'Getting there', c: 'amber' }
    : { t: 'Needs revision', c: 'red' };

  return (
    <div className="page wrap">
      <div className="row" style={{ gap: 12, alignItems: 'baseline' }}>
        <h1 style={{ fontFamily: 'var(--font-serif)', fontWeight: 600 }}>
          {result.score}<span style={{ color: 'var(--muted)', fontSize: 'var(--fs-lg)', fontWeight: 500, fontFamily: 'var(--font-sans)' }}>/{result.total}</span>
        </h1>
        <span className={'badge ' + verdict.c}>{verdict.t}</span>
      </div>
      <p className="muted" style={{ marginTop: 6 }}>{result.modeLabel}</p>

      <div className="grid g4" style={{ marginTop: 20 }}>
        <div className="stat"><div className="v">{accuracy}%</div><div className="l">Accuracy</div></div>
        <div className="stat"><div className="v">{fmtClock(result.timeTotal)}</div><div className="l">Total time</div></div>
        <div className="stat"><div className="v">{fmtClock(result.total ? result.timeTotal / result.total : 0)}</div><div className="l">Avg pace</div></div>
        <div className="stat"><div className="v">{result.skipped}</div><div className="l">Skipped</div></div>
      </div>

      <div className="row" style={{ marginTop: 20, gap: 8 }}>
        <button className="btn" onClick={onHome}><Icon name="arrowL" size={13} />Back to practice</button>
        {wrongItems.length > 0 && (
          <button className="btn primary" onClick={() => onRetryWrong(wrongItems.map((i) => i.qid))}>
            <Icon name="refresh" size={13} />Retry {wrongItems.length} wrong
          </button>
        )}
      </div>

      <h2 className="section-title">Pace</h2>
      <div className="card"><PaceProfile items={result.items} /></div>
      <div className="card" style={{ marginTop: 12 }}><PaceJourney items={result.items} /></div>

      <h2 className="section-title">Answer review</h2>
      <div className="qreview-list">
        {result.items.map((it, i) => {
          const q = qmap[it.qid];
          const open = openItem === i;
          return (
            <div className="qreview" key={i}>
              <div className="qreview-head">
                <span className="qnum">#{i + 1}</span>
                <button className="badge grey" onClick={() => onStudyAssignment(it.aid)}>{it.aname}</button>
                <span style={{ marginLeft: 'auto' }} className={'badge ' + (it.skipped ? 'grey' : it.correct ? 'green' : 'red')}>
                  {it.skipped ? 'Skipped' : it.correct ? 'Correct' : 'Wrong'}
                </span>
                <span className="tiny" style={{ fontVariantNumeric: 'tabular-nums' }}>{(it.timeMs / 1000).toFixed(1)}s</span>
              </div>
              <div className="qreview-question">{q ? q.question : '(missing)'}</div>
              <div className="qreview-answers">
                <div>Your answer: <span className={it.correct ? 'ok' : 'bad'}>{it.sel.length ? it.sel.join(' · ') : 'skipped'}</span></div>
                {!it.correct && <div>Correct answer: <span className="ok">{it.ans.join(' · ')}</span></div>}
              </div>
              {q && q.explanation && (
                <>
                  <button className="btn sm" style={{ marginTop: 10 }} onClick={() => setOpenItem(open ? null : i)}>
                    {open ? 'Hide explanation' : 'Show explanation'}
                  </button>
                  {open && <div className="explain">{q.explanation}</div>}
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function HistoryView({ progress, qmap, onStudyAssignment, onClear }) {
  const [open, setOpen] = useState(null);
  const runs = progress.history;

  if (!runs.length) {
    return (
      <div className="page wrap">
        <h1 style={{ marginBottom: 20 }}>History</h1>
        <div className="card empty">
          <div className="empty-mark"><Icon name="chart" size={22} /></div>
          <h3>No tests yet</h3>
          <p>Take a practice quiz and it will appear here.</p>
        </div>
      </div>
    );
  }

  const totalTests = runs.length;
  const avgAcc = Math.round(runs.reduce((s, r) => s + pct(r.score, r.total), 0) / totalTests);
  const bestAcc = Math.max(...runs.map((r) => pct(r.score, r.total)));

  return (
    <div className="page wrap">
      <div className="row between" style={{ marginBottom: 20 }}>
        <h1>History</h1>
        <button className="btn sm danger" onClick={onClear}>Clear history</button>
      </div>

      <div className="grid g3" style={{ marginBottom: 20 }}>
        <div className="stat"><div className="v">{totalTests}</div><div className="l">Tests</div></div>
        <div className="stat"><div className="v">{avgAcc}%</div><div className="l">Avg accuracy</div></div>
        <div className="stat"><div className="v">{bestAcc}%</div><div className="l">Best</div></div>
      </div>

      {runs.map((r) => {
        const a = pct(r.score, r.total);
        const cls = a >= 80 ? 'good' : a >= 50 ? 'mid' : 'bad';
        return (
          <div className="hrow" key={r.id}>
            <div className={'score-pill ' + cls}>{r.score}<small>/{r.total}</small></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 500, fontSize: 'var(--fs-sm)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.modeLabel}</div>
              <div className="tiny" style={{ marginTop: 3 }}>
                {fmtDate(r.ts)} · {a}% · {fmtClock(r.total ? r.timeTotal / r.total : 0)} avg
                {r.skipped ? ' · ' + r.skipped + ' skipped' : ''}
              </div>
            </div>
            <button className="btn sm" onClick={() => setOpen(r)}>Details</button>
          </div>
        );
      })}

      {open && <HistoryDetail run={open} qmap={qmap} onClose={() => setOpen(null)} onStudyAssignment={onStudyAssignment} />}
    </div>
  );
}

function CheatsheetView({ subject, progress, onStudy, onPracticeWeak }) {
  const weak = useMemo(() => weakQuestions(subject, progress), [subject, progress]);
  const [showAnswers, setShowAnswers] = useState(true);

  const byAssignment = useMemo(() => {
    const m = {};
    weak.forEach((w) => {
      const k = w.q._aid;
      if (!m[k]) m[k] = { id: k, name: w.q._aname, items: [] };
      m[k].items.push(w);
    });
    return Object.values(m).sort((a, b) => b.items.length - a.items.length);
  }, [weak]);

  if (!weak.length) {
    return (
      <div className="page wrap">
        <h1 style={{ marginBottom: 20 }}>Cheatsheet</h1>
        <div className="card empty">
          <div className="empty-mark"><Icon name="sparkles" size={22} /></div>
          <h3>No weak spots detected</h3>
          <p>
            {Object.keys(progress.questions).length
              ? 'Keep practising — questions you repeatedly get wrong will appear here.'
              : 'Attempt a few quizzes and your cheatsheet will build itself.'}
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className="page wrap">
      <div className="cheat-head">
        <div>
          <h1>Cheatsheet</h1>
          <p className="muted" style={{ marginTop: 6 }}>
            {weak.length} weak question{weak.length > 1 ? 's' : ''} detected from your answers
          </p>
        </div>
        <button className="toggle-answers" onClick={() => setShowAnswers(!showAnswers)}>
          <Icon name={showAnswers ? 'eyeOff' : 'eye'} size={13} />
          {showAnswers ? 'Hide answers' : 'Show answers'}
        </button>
      </div>

      <div className="card">
        <h3>Focus weeks</h3>
        <p className="muted" style={{ margin: '8px 0 16px' }}>Open a week's notes to study it in full.</p>
        <div className="grid g2" style={{ marginBottom: 16 }}>
          {byAssignment.map((g) => (
            <button className="chk on" key={g.id} onClick={() => onStudy(subject.assignments.find((a) => a.id === g.id))}>
              <span className="box">✓</span>
              <span style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                <span style={{ display: 'block', fontWeight: 500, fontSize: 'var(--fs-sm)' }}>{g.name}</span>
                <span className="tiny">{g.items.length} weak question{g.items.length > 1 ? 's' : ''}</span>
              </span>
              <span style={{ color: 'var(--muted)' }}><Icon name="book" size={15} /></span>
            </button>
          ))}
        </div>
        <button className="btn primary block" onClick={onPracticeWeak}>
          <Icon name="play" size={13} /> Drill all {weak.length} weak questions
        </button>
      </div>

      <h2 className="section-title">Revision notes</h2>
      {weak.map(({ q, st }) => {
        const ans = answerIndices(q);
        return (
          <div className="card note" key={q.id} style={{ marginBottom: 12 }}>
            <div className="note-head">
              <span className="qnum">wrong {st.w}×</span>
              <span className="badge grey">{q._aname}</span>
              <span className="badge red" style={{ marginLeft: 'auto' }}>{pct(st.c, st.a)}%</span>
            </div>
            <div className="qtext" style={{ fontSize: 'var(--fs-sm)' }}>{q.question}</div>
            {showAnswers ? (
              <>
                <ul className="opts">
                  {q.options.map((o, j) => (
                    <li key={j} className={ans.includes(j) ? 'ans' : ''}>
                      <span className="tag">{String.fromCharCode(65 + j)}</span>
                      <span style={{ flex: 1 }}>{o}</span>
                      {ans.includes(j) && <span className="tick">✓</span>}
                    </li>
                  ))}
                </ul>
                {q.explanation && <div className="explain"><b>Why:</b> {q.explanation}</div>}
              </>
            ) : (
              <button className="btn sm" onClick={() => setShowAnswers(true)}>
                <Icon name="eye" size={13} /> Reveal answers
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}
