function App() {
  const [theme, setTheme] = useState(() => LS.get('nptel.theme', 'dark'));
  const [accent, setAccent] = useState(() => LS.get('nptel.accent', 'ocean'));
  const [settings, setSettings] = useState(() => ({
    instantFeedback: true, shuffleQuestions: true, shuffleOptions: true,
    ...LS.get('nptel.settings', {}),
  }));
  const [showSettings, setShowSettings] = useState(false);
  const [showSubjects, setShowSubjects] = useState(false);

  // ── First visit: show subject selection. Returning visits: reopen the last subject
  // only if the user explicitly selected one before. This avoids treating the default
  // first subject as a saved choice for brand-new visitors or legacy auto-saved data.
  const [subjectId, setSubjectId] = useState(() => {
    const hash = (typeof window !== 'undefined' && window.location.hash || '').replace('#', '');
    if (hash && SUBJECTS.some(s => s.id === hash)) return hash;
    const savedId = LS.get('nptel.currentSubject', null);
    // Backward compatibility: older versions only auto-saved the first subject by default.
    // A saved non-default subject is therefore likely to be a real previous selection.
    const hasExplicitSelection = LS.get('nptel.subjectSelected', false) || Boolean(savedId && savedId !== SUBJECTS[0].id);
    if (hasExplicitSelection && SUBJECTS.some(s => s.id === savedId)) return savedId;
    // Fallback subject if the user enters practice without choosing a subject.
    return 'psychology_of_learning';
  });
  const [subject, setSubject] = useState(null);
  const [progress, setProgress] = useState(null);
  const [banner, setBanner] = useState(null);
  const cacheRef = useRef({});

  const [screen, setScreen] = useState(() => {
    const hash = (typeof window !== 'undefined' && window.location.hash || '').replace('#', '');
    if (hash && SUBJECTS.some(s => s.id === hash)) return 'loading';
    const savedId = LS.get('nptel.currentSubject', null);
    const hasExplicitSelection = LS.get('nptel.subjectSelected', false) || Boolean(savedId && savedId !== SUBJECTS[0].id);
    return hasExplicitSelection && SUBJECTS.some(s => s.id === savedId) ? 'loading' : 'landing';
  });
  const screenRef = useRef(screen);
  screenRef.current = screen;
  const quizReturnScreenRef = useRef('home');
  const [quizConfig, setQuizConfig] = useState(null);
  const [result, setResult] = useState(null);
  const [notesAssignment, setNotesAssignment] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    LS.set('nptel.theme', theme);
  }, [theme]);

  useEffect(() => {
    document.documentElement.setAttribute('data-accent', accent);
    LS.set('nptel.accent', accent);
  }, [accent]);

  useEffect(() => { LS.set('nptel.settings', settings); }, [settings]);

  // Save the current course only after an actual selection or an explicit course deep-link.
  // Do not auto-save SUBJECTS[0] while a first-time visitor is still on the landing screen.
  useEffect(() => {
    if (subjectId && screen !== 'landing') {
      LS.set('nptel.currentSubject', subjectId);
      LS.set('nptel.subjectSelected', true);
    }
  }, [subjectId, screen]);

  // Keep the URL hash in sync so subjects are deep-linkable and shareable.
  useEffect(() => {
    const currentHash = window.location.hash.replace('#', '');
    if (screen === 'landing') {
      if (currentHash) history.replaceState(null, '', window.location.pathname + window.location.search);
    } else if (subjectId && currentHash !== subjectId) {
      history.replaceState(null, '', '#' + subjectId);
    }
  }, [subjectId, screen]);

  // Respond to manual hash edits and browser back/forward.
  useEffect(() => {
    const onHashChange = () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && SUBJECTS.some(s => s.id === hash) && hash !== subjectId) {
        setSubjectId(hash);
        setScreen('loading');
      } else if (!hash && screen !== 'landing' && screen !== 'quiz') {
        setScreen('landing');
      }
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, [subjectId, screen]);

  const subjectIndex = useMemo(
    () => SUBJECTS.map((s) => ({ id: s.id, name: s.name, file: s.file, image: s.image, institute: s.institute })),
    []
  );

  useEffect(() => {
    if (!subjectId || !subjectIndex.some((s) => s.id === subjectId)) {
      if (subjectIndex.length) setSubjectId(subjectIndex[0].id);
      return;
    }
    let cancelled = false;
    (async () => {
      setBanner(null);
      try {
        const meta = subjectIndex.find((s) => s.id === subjectId);
        let data;
        if (cacheRef.current[subjectId]) data = cacheRef.current[subjectId];
        else {
          try { data = await fetchJSON(QUESTIONS_FOLDER + meta.file); }
          catch (err) {
            data = DEMO_SUBJECT;
            setBanner('Could not load "' + meta.file + '" (' + err.message + '). Showing the built-in sample data.');
          }
        }
        const norm = normaliseSubject(data, meta);
        cacheRef.current[subjectId] = norm;
        if (cancelled) return;
        setSubject(norm);
        setProgress(loadProgress(subjectId));
        setScreen(prev => prev === 'loading' ? 'home' : prev);
      } catch (err) {
        if (cancelled) return;
        setBanner('Failed to load subject: ' + err.message);
        setScreen('landing');
      }
    })();
    return () => { cancelled = true; };
  }, [subjectId, subjectIndex]);

  useEffect(() => { if (subjectId && progress) LS.set(PROG_KEY(subjectId), progress); }, [subjectId, progress]);

  const qmap = useMemo(() => {
    const m = {};
    if (subject) subject.assignments.forEach((a) => a.questions.forEach((q) => { m[q.id] = q; }));
    return m;
  }, [subject]);

  const prep = useCallback((list) => list.map((q) => prepareQuestion(q, settings.shuffleOptions)), [settings.shuffleOptions]);
  const orderPool = useCallback((pool) => {
    if (subjectId === 'joy_of_computing_using_python') return pool.slice();
    return settings.shuffleQuestions ? shuffle(pool) : pool.slice();
  }, [settings.shuffleQuestions, subjectId]);

  const startQuiz = (cfg) => {
    // Remember the actual source screen so Back returns to the workflow the learner came from.
    const originScreen = screenRef.current;
    if (originScreen !== 'quiz') quizReturnScreenRef.current = originScreen || 'home';
    // Captures all practice-start controls that use the shared startQuiz flow.
    trackGAEvent('practice_button_click', {
      subject_id: subjectId || 'unknown',
      practice_mode: cfg.mode || 'unknown',
    });
    if (!cfg.questions.length) { alert('No questions available for this selection.'); return; }
    trackGAEvent('quiz_start', {
      subject_id: subjectId || 'unknown',
      practice_mode: cfg.mode || 'unknown',
      planned_questions: cfg.questions.length,
      assignment_count: (cfg.assignmentIds || []).length,
    });
    setQuizConfig({
      ...cfg,
      subjectId,
      shuffleQuestions: subjectId === 'joy_of_computing_using_python' ? false : settings.shuffleQuestions,
      shuffleOptions: settings.shuffleOptions,
    });
    setScreen('quiz');
  };

  const startRandom = useCallback((n) => {
    const pool = orderPool(allQuestions(subject));
    const picked = pool.slice(0, Math.min(n, pool.length));
    startQuiz({ mode: 'random', title: 'Random Practice · ' + picked.length + ' Q', questions: prep(picked), assignmentIds: [] });
  }, [subject, orderPool, prep]);

  const startCustom = useCallback((assignmentIds, n) => {
    const bank = allQuestions(subject).filter((q) => assignmentIds.includes(q._aid));
    const picked = orderPool(bank).slice(0, Math.min(n, bank.length));
    const label = assignmentIds.length === 1
      ? (subject.assignments.find((a) => a.id === assignmentIds[0]) || {}).name || 'Week'
      : assignmentIds.length + ' weeks';
    startQuiz({ mode: 'custom', title: label + ' · ' + picked.length + ' Q', questions: prep(picked), assignmentIds });
  }, [subject, orderPool, prep]);

  const startWeak = useCallback(() => {
    const list = weakQuestions(subject, progress).map((w) => w.q);
    startQuiz({ mode: 'weak', title: 'Weak Drill · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, progress, prep, orderPool]);

  const startBookmarks = useCallback(() => {
    const ids = progress.bookmarks || [];
    const list = allQuestions(subject).filter((q) => ids.includes(q.id));
    startQuiz({ mode: 'bookmarks', title: 'Bookmarked · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, progress, prep, orderPool]);

  const retryWrong = useCallback((qids) => {
    const list = allQuestions(subject).filter((q) => qids.includes(q.id));
    startQuiz({ mode: 'retry', title: 'Retry Wrong · ' + list.length + ' Q', questions: prep(orderPool(list)), assignmentIds: [] });
  }, [subject, prep, orderPool]);

  const handleFinish = useCallback((run) => {
    setProgress((prev) => {
      const p = prev ? JSON.parse(JSON.stringify(prev)) : emptyProgress();
      run.items.forEach((it) => {
        if (it.skipped) return;
        const st = p.questions[it.qid] || { a: 0, c: 0, w: 0, t: 0, last: 0, streak: 0 };
        st.a += 1; st.t += it.timeMs; st.last = run.ts;
        if (it.correct) { st.c += 1; st.streak = (st.streak || 0) + 1; }
        else { st.w += 1; st.streak = 0; }
        p.questions[it.qid] = st;
      });
      p.history = [{ ...run, subjectId: subject.id }, ...p.history].slice(0, 100);
      return p;
    });
    setResult(run);
    setScreen('result');
  }, [subject]);

  const toggleBookmark = useCallback((qid) => {
    setProgress((prev) => {
      const p = prev ? { ...prev } : emptyProgress();
      const bm = p.bookmarks || [];
      p.bookmarks = bm.includes(qid) ? bm.filter((x) => x !== qid) : [...bm, qid];
      return p;
    });
  }, []);

  const changeSubject = (id) => {
    setSubjectId(id);
    LS.set('nptel.currentSubject', id);
    LS.set('nptel.subjectSelected', true);
    cacheRef.current = {};
    setSubject(null); setProgress(null);
    setShowSettings(false);
    setScreen('loading');
  };

  const exportProgress = () => {
    const data = {};
    Object.keys(localStorage).filter((k) => k.startsWith('nptel.')).forEach((k) => { data[k] = localStorage.getItem(k); });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mooc-mastery-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importProgress = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Object.keys(data).forEach((k) => { if (k.startsWith('nptel.')) localStorage.setItem(k, data[k]); });
        alert('Progress imported. Reloading…');
        location.reload();
      } catch (e) { alert('Invalid backup file.'); }
    };
    reader.readAsText(file);
  };

  const resetProgress = () => {
    if (!confirm('Reset all progress, history and bookmarks for "' + (subject ? subject.title : '') + '"?')) return;
    LS.del(PROG_KEY(subjectId));
    setProgress(emptyProgress());
    setShowSettings(false);
    setScreen('home');
  };

  const openStudy = (assignment) => {
    if (!assignment) return;
    setNotesAssignment(assignment);
    setScreen('notes');
  };

  const navigate = useCallback((target) => {
    if (target === 'notes') setNotesAssignment((current) => current || (subject && subject.assignments[0]) || null);
    setScreen(target);
  }, [subject]);

  if (screen === 'loading' || (screen !== 'landing' && !subject)) {
    return (
      <div className="center">
        <div style={{ textAlign: 'center' }}>
          <div className="spin" />
          <p className="muted" style={{ marginTop: 14 }}>Loading…</p>
        </div>
      </div>
    );
  }

  if (screen === 'quiz' && quizConfig) {
    return (
      <QuizRunner
        config={quizConfig} settings={settings}
        bookmarks={progress.bookmarks || []}
        onToggleBookmark={toggleBookmark}
        onFinish={handleFinish}
        onQuit={() => setScreen(quizReturnScreenRef.current || 'home')}
      />
    );
  }

  const navItems = [
    { id: 'landing',    label: 'Home',       icon: 'home' },
    { id: 'home',       label: 'Practice',   icon: 'practice' },
    { id: 'notes',      label: 'Notes',      icon: 'book' },
    { id: 'history',    label: 'History',    icon: 'history' },
    { id: 'cheatsheet', label: 'Cheatsheet', icon: 'notes' },
  ];
  const activeTab = screen;

  return (
    <div className="app">
      <div className="topbar">
        <div className="wrap">
          <div className="topbar-in">
            <button className="brand" onClick={() => navigate('landing')} aria-label="Go to home">
              <span className="brand-mark"><img src="/assets/mooc-mastery-icon.png" alt="" /></span>
              <span className="brand-text">
                <span className="brand-title">Mooc Mastery</span>
                <span className="brand-sub">
                  {screen === 'landing' || !subject ? 'NPTEL MCQ practice' : subject.title}
                </span>
              </span>
            </button>
            {subject && screen !== 'landing' && (
              <button className="switch-btn" onClick={() => setShowSubjects(true)}
                title="Switch subject" aria-haspopup="dialog">
                <Icon name="swap" size={14} />
                <span className="switch-btn-label">Switch</span>
              </button>
            )}
            <nav className="top-tabs" aria-label="Main">
              {navItems.map((t) => (
                <button key={t.id}
                  className={activeTab === t.id ? 'active' : ''}
                  title={t.label}
                  onClick={() => navigate(t.id)}
                  aria-current={activeTab === t.id ? 'page' : undefined}>
                  <span>{t.label}</span>
                </button>
              ))}
            </nav>
            <div className="top-actions">
              <button className="icon-btn" title="Toggle theme" aria-label="Toggle colour theme" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
              </button>
              <button className="icon-btn" title="Settings" aria-label="Open settings" onClick={() => setShowSettings(true)}>
                <Icon name="settings" size={16} />
              </button>
            </div>
          </div>
        </div>
      </div>

      {banner && screen !== 'landing' && (
        <div className="wrap" style={{ paddingTop: 12 }}><div className="banner">{banner}</div></div>
      )}

      <div style={{ flex: 1 }} className="app-main" key={screen}>
        {screen === 'landing' && (
          <LandingPage
            subjects={subjectIndex}
            banner={banner}
            onPick={changeSubject}
          />
        )}

        {screen === 'home' && subject && (
          <HomeView
            subject={subject} progress={progress} settings={settings} setSettings={setSettings}
            onStartRandom={startRandom} onStartCustom={startCustom}
            onStartWeak={startWeak} onStartBookmarks={startBookmarks}
            onStudy={openStudy} goHistory={() => setScreen('history')}
            onSwitchSubject={() => setShowSubjects(true)}
          />
        )}

        {screen === 'result' && result && (
          <ResultView
            result={result} qmap={qmap}
            onHome={() => setScreen(quizReturnScreenRef.current && quizReturnScreenRef.current !== 'result' ? quizReturnScreenRef.current : 'home')}
            onRetryWrong={retryWrong}
            onStudyAssignment={(aid) => openStudy(subject.assignments.find((a) => a.id === aid))}
          />
        )}

        {screen === 'history' && subject && (
          <HistoryView
            progress={progress} qmap={qmap} totalQuestions={subject.assignments.reduce((sum, item) => sum + item.questions.length, 0)}
            onStudyAssignment={(aid) => openStudy(subject.assignments.find((a) => a.id === aid))}
            onClear={() => { if (confirm('Clear all test history for this subject?')) setProgress({ ...progress, history: [] }); }}
          />
        )}

        {screen === 'cheatsheet' && subject && (
          <CheatsheetView
            subject={subject} progress={progress}
            onStudy={openStudy} onPracticeWeak={startWeak}
          />
        )}

        {screen === 'notes' && subject && (
          <NotesView
            subject={subject} assignment={(notesAssignment && subject.assignments.some((item) => item.id === notesAssignment.id)) ? notesAssignment : subject.assignments[0]} progress={progress}
            onPractice={(aid, n) => {
              const chosenAssignment = subject.assignments.find((item) => item.id === aid);
              if (chosenAssignment) setNotesAssignment(chosenAssignment);
              startCustom([aid], n);
            }}
          />
        )}
      </div>

      <nav className="bottom-nav" aria-label="Main">
        {navItems.map((t) => (
          <button key={t.id} data-tab={t.id}
            className={activeTab === t.id ? 'active' : ''}
            onClick={() => navigate(t.id)}
            aria-current={activeTab === t.id ? 'page' : undefined}>
            <Icon name={t.icon} size={20} strokeWidth={1.5} />
            <span>{t.label}</span>
          </button>
        ))}
      </nav>

      {showSettings && (
        <SettingsModal
          settings={settings} setSettings={setSettings}
          theme={theme} setTheme={setTheme}
          accent={accent} setAccent={setAccent}
          subject={subject} subjects={subjectIndex}
          onChangeSubject={changeSubject}
          onExport={exportProgress} onImport={importProgress}
          onResetProgress={resetProgress}
          onClose={() => setShowSettings(false)}
        />
      )}

      {showSubjects && (
        <SubjectSheet
          subjects={subjectIndex}
          currentId={subjectId}
          onPick={(id) => {
            setShowSubjects(false);
            if (id !== subjectId) changeSubject(id);
          }}
          onClose={() => setShowSubjects(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
/* Capture the browser's install prompt without replacing the app or service-worker code. */
let deferredInstallPrompt = null;
window.__moocInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  window.__moocInstallPrompt = event;
  window.dispatchEvent(new Event("pwa-install-available"));
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  window.__moocInstallPrompt = null;
  window.dispatchEvent(new Event("pwa-installed"));
});

window.installMoocMastery = async () => {
  if (!deferredInstallPrompt) return false;
  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  window.__moocInstallPrompt = null;
  promptEvent.prompt();
  const choice = await promptEvent.userChoice;
  if (choice.outcome !== "accepted") {
    // Browsers generally require a fresh beforeinstallprompt event before another attempt.
    return false;
  }
  return true;
};
</script>

</body>
</html>
